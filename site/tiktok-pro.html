<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080910">
<title>Ripo TikTok LIVE AI Pro</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080910;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#080910}
</style>
</head>
<body>
<iframe id="app" src="./tiktok.html?v=20260813-watcher-v3" title="Ripo TikTok LIVE AI"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('ripo-enhancements-loader'))return;
    const s=doc.createElement('script');
    s.id='ripo-enhancements-loader';
    s.src='./tiktok-enhancements.js?v=20260813-watcher-v3';
    doc.body.appendChild(s);
  }catch(e){console.error('Could not load TikTok dashboard enhancements',e)}
});
</script>
</body>
</html>
