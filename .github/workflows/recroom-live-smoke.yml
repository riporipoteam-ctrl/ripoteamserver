name: Rec Room Live Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recroom-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live compatibility gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 4 \
            "https://echoxr-ripoteam-cloud-pc.hf.space/flux/health" \
            -o /tmp/recroom-health.json
          cat /tmp/recroom-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/recroom-health.json'))
          assert data.get('ok') is True, data
          assert data.get('buildId') == '8751857', data
          assert data.get('buildDate') == '2022-05-19', data
          assert data.get('photon', {}).get('configured') is True, data
          print('May 19 2022 gateway and Photon config are live.')
          PY

      - name: Verify live browser session broker
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            "https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/status" \
            -o /tmp/recroom-status.json
          cat /tmp/recroom-status.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/recroom-status.json'))
          assert data.get('ok') is True, data
          assert data.get('targetBuild') == 'recroom-2022-05-19', data
          assert data.get('configured') is True, data
          hosts=int(data.get('onlineHosts') or 0)
          print(f'RECROOM_ONLINE_HOSTS={hosts}')
          print('Broker is live and configured.')
          PY

      - name: Verify secure host pairing routes are live
        run: |
          set -euo pipefail
          create_status="$(curl --silent --show-error --output /tmp/pair-create.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{}' \
            'https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/host-pairing')"
          cat /tmp/pair-create.json
          test "$create_status" = "401"

          claim_status="$(curl --silent --show-error --output /tmp/pair-claim.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"pairingCode":"definitely-not-a-real-pairing-code"}' \
            'https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/host-pairing/claim')"
          cat /tmp/pair-claim.json
          test "$claim_status" = "401"
          echo "Host pairing endpoints are live and reject unauthenticated/invalid claims."

      - name: Verify browser preflight from Flux Pages
        run: |
          set -euo pipefail
          for endpoint in sessions host-pairing; do
            curl --silent --show-error --dump-header "/tmp/recroom-cors-$endpoint.txt" --output /dev/null \
              --request OPTIONS \
              --header 'Origin: https://riporipoteam-ctrl.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: authorization,content-type' \
              "https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/$endpoint"
            cat "/tmp/recroom-cors-$endpoint.txt"
            ENDPOINT="$endpoint" python - <<'PY'
          import os
          headers={}
          path=f"/tmp/recroom-cors-{os.environ['ENDPOINT']}.txt"
          for line in open(path, encoding='utf-8', errors='replace'):
              if ':' not in line:
                  continue
              key, value=line.split(':',1)
              headers[key.strip().lower()]=value.strip()
          origin=headers.get('access-control-allow-origin','')
          methods=headers.get('access-control-allow-methods','').lower()
          allowed_headers=headers.get('access-control-allow-headers','').lower()
          assert origin in {'*','https://riporipoteam-ctrl.github.io'}, headers
          assert '*' in methods or 'post' in methods, headers
          assert '*' in allowed_headers or ('authorization' in allowed_headers and 'content-type' in allowed_headers), headers
          print('Flux GitHub Pages CORS preflight is accepted by the live Rec Room broker.')
          PY
          done
