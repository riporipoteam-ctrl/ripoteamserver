name: Rec Room Live Smoke

on:
  push:
    branches: [main]
    paths:
      - "hf-space/recroom_autoload.py"
      - "hf-space/recroom_compat.py"
      - "hf-space/recroom_compat_extra.py"
      - "hf-space/recroom_room_compat.py"
      - "hf-space/recroom_match_model.py"
      - "hf-space/recroom_match_compat.py"
      - "hf-space/recroom_gateway.py"
      - "hf-space/recroom_broker.py"
      - "hf-space/recroom_public.py"
      - ".github/workflows/recroom-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live compatibility gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            "https://echoxr-ripoteam-cloud-pc.hf.space/flux/health" \
            -o /tmp/recroom-health.json
          cat /tmp/recroom-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/recroom-health.json'))
          assert data.get('ok') is True, data
          assert data.get('buildId') == '8751857', data
          assert data.get('buildDate') == '2022-05-19', data
          assert data.get('photon', {}).get('configured') is True, data
          print('May 19 2022 gateway and Photon config are live.')
          PY

      - name: Verify typed May 2022 startup DTOs are live
        run: |
          set -euo pipefail
          base='https://echoxr-ripoteam-cloud-pc.hf.space'
          for i in $(seq 1 24); do
            curl -fsS "$base/api/config/v2" -o /tmp/config.json || true
            if python - <<'PY'
          import json,sys
          try:
              d=json.load(open('/tmp/config.json'))
              ok=isinstance(d,list) and any(x.get('Key')=='BuildId' and x.get('Value')=='8751857' for x in d if isinstance(x,dict))
          except Exception:
              ok=False
          sys.exit(0 if ok else 1)
          PY
            then break; fi
            sleep 5
          done
          cat /tmp/config.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/config.json'))
          assert isinstance(d,list), d
          values={x.get('Key'):x.get('Value') for x in d if isinstance(x,dict)}
          assert values.get('BuildId')=='8751857', values
          assert values.get('BuildDate')=='2022-05-19', values
          assert values.get('Screens.ForceVerification')=='0', values
          assert values.get('Maintenance.Enabled')=='false', values
          print('Typed config-v2 list is live.')
          PY

          curl -fsS "$base/api/versioncheck/v4" -o /tmp/version.json
          cat /tmp/version.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/version.json'))
          assert d.get('VersionStatus')==0, d
          assert d.get('UpdateNotificationStage')==0, d
          assert d.get('RequiresUpdate') is False, d
          print('Version check allows the May 2022 client.')
          PY

          curl -fsS "$base/Auth/.well-known/openid-configuration" -o /tmp/oidc.json
          curl -fsS "$base/Auth/.well-known/openid-configuration/jwks" -o /tmp/jwks.json
          python - <<'PY'
          import json
          o=json.load(open('/tmp/oidc.json')); j=json.load(open('/tmp/jwks.json'))
          assert o.get('issuer','').startswith('http://127.0.0.1:81/Auth'), o
          assert o.get('token_endpoint','').endswith('/Auth/connect/token'), o
          keys=j.get('keys') or []
          assert len(keys)==1 and keys[0].get('kty')=='RSA' and keys[0].get('alg')=='RS256', j
          print('Local OIDC/JWKS token-validation surface is live.')
          PY

      - name: Verify expanded post-login, Orientation and matchmaking routes are mounted
        run: |
          set -euo pipefail
          base='https://echoxr-ripoteam-cloud-pc.hf.space'
          # Protected routes should be 401 without a native Flux session. A 404
          # means the corresponding compatibility layer did not mount.
          for path in \
            '/api/gameconfigs/v1/all' \
            '/api/relationships/v2/get' \
            '/outfits/me/saved' \
            '/econ/roomInventory/player' \
            '/Room_server/dormroom/me' \
            '/Room_server/rooms/13'; do
            code="$(curl --silent --show-error --output /tmp/extra-route.json --write-out '%{http_code}' "$base$path")"
            echo "$path -> HTTP $code"
            cat /tmp/extra-route.json || true
            test "$code" = "401"
          done
          for path in \
            '/Matchmaking/matchmake/dorm' \
            '/Matchmaking/player/heartbeat'; do
            code="$(curl --silent --show-error --output /tmp/match-route.json --write-out '%{http_code}' \
              --request POST --header 'content-type: application/json' --data '{}' "$base$path")"
            echo "$path -> HTTP $code"
            cat /tmp/match-route.json || true
            test "$code" = "401"
          done
          echo 'Orientation, Dorm and recovered roomInstance matchmaking layers are mounted.'

      - name: Verify live browser session broker
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            "https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/status" \
            -o /tmp/recroom-status.json
          cat /tmp/recroom-status.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/recroom-status.json'))
          assert data.get('ok') is True, data
          assert data.get('targetBuild') == 'recroom-2022-05-19', data
          assert data.get('configured') is True, data
          hosts=int(data.get('onlineHosts') or 0)
          sessions=int(data.get('sessions') or 0)
          print(f'RECROOM_ONLINE_HOSTS={hosts}')
          print(f'RECROOM_LIVE_SESSIONS={sessions}')
          print('Broker is live and configured.')
          PY

      - name: Verify secure host pairing routes are live
        run: |
          set -euo pipefail
          create_status="$(curl --silent --show-error --output /tmp/pair-create.json --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            'https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/host-pairing')"
          cat /tmp/pair-create.json
          test "$create_status" = "401"
          claim_status="$(curl --silent --show-error --output /tmp/pair-claim.json --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"pairingCode":"definitely-not-a-real-pairing-code"}' \
            'https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/host-pairing/claim')"
          cat /tmp/pair-claim.json
          test "$claim_status" = "401"
          echo "Host pairing endpoints are live and reject unauthenticated/invalid claims."

      - name: Verify browser preflight from Flux Pages
        run: |
          set -euo pipefail
          for endpoint in sessions host-pairing; do
            curl --silent --show-error --dump-header "/tmp/recroom-cors-$endpoint.txt" --output /dev/null \
              --request OPTIONS \
              --header 'Origin: https://riporipoteam-ctrl.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: authorization,content-type' \
              "https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-public/$endpoint"
            cat "/tmp/recroom-cors-$endpoint.txt"
            ENDPOINT="$endpoint" python - <<'PY'
          import os
          headers={}
          path=f"/tmp/recroom-cors-{os.environ['ENDPOINT']}.txt"
          for line in open(path, encoding='utf-8', errors='replace'):
              if ':' not in line: continue
              key, value=line.split(':',1); headers[key.strip().lower()]=value.strip()
          origin=headers.get('access-control-allow-origin','')
          methods=headers.get('access-control-allow-methods','').lower()
          allowed_headers=headers.get('access-control-allow-headers','').lower()
          assert origin in {'*','https://riporipoteam-ctrl.github.io'}, headers
          assert '*' in methods or 'post' in methods, headers
          assert '*' in allowed_headers or ('authorization' in allowed_headers and 'content-type' in allowed_headers), headers
          print('Flux GitHub Pages CORS preflight is accepted by the live Rec Room broker.')
          PY
          done
