name: Capture encrypted Telegram allowlist

on:
  push:
    branches: [main]
    paths:
      - ".verification/capture-pairing-allowlist.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for pairing approval and capture encrypted allowlist
        run: |
          set -euo pipefail
          mkdir -p hf-space/sealed .deployment-status
          for attempt in $(seq 1 100); do
            echo "Pairing capture attempt $attempt"
            code=$(curl -L -sS --max-time 30 -o /tmp/ai.json -w '%{http_code}' "https://echoxr-ripoteam-cloud-pc.hf.space/api/ai/status?pair_capture=$attempt" || true)
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/ai.json').read_text())
          telegram=d.get('telegram',{})
          export=telegram.get('pairing_export')
          if not isinstance(export, dict) or export.get('ready') is not True:
              raise SystemExit(1)
          envelope=export.get('envelope')
          if not isinstance(envelope, dict) or envelope.get('purpose') != 'telegram-allowed-users':
              raise SystemExit(1)
          Path('hf-space/sealed/telegram-allowlist.json').write_text(json.dumps(envelope, indent=2)+'\n')
          safe={
              'status':'CAPTURED',
              'approved_count':export.get('approved_count'),
              'key_id':envelope.get('key_id'),
              'purpose':envelope.get('purpose'),
          }
          Path('.deployment-status/telegram-pairing.json').write_text(json.dumps(safe, indent=2)+'\n')
          PY
              then
                rm -f hf-space/pairing-request.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Encrypted pairing export did not become ready in time" >&2
          cat /tmp/ai.json || true
          exit 1

      - name: Commit encrypted allowlist and remove one-time request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/sealed/telegram-allowlist.json hf-space/pairing-request.json .deployment-status/telegram-pairing.json
          git commit -m "Persist approved Telegram user securely"
          git pull --rebase origin main
          git push origin HEAD:main
