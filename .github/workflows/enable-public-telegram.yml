name: Enable public-safe Telegram

on:
  push:
    branches: [main]
    paths:
      - ".verification/enable-public-telegram.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply public-safe Telegram patch
        run: python .github/scripts/enable_public_telegram.py
      - name: Validate Python and safety markers
        run: |
          python -m py_compile hf-space/ai_stack.py hf-space/app.py hf-space/sealed_secrets.py
          python - <<'PY'
          from pathlib import Path
          text = Path('hf-space/ai_stack.py').read_text(encoding='utf-8')
          required = [
              '"TELEGRAM_ALLOW_ALL_USERS": "true"',
              'platform_toolsets:',
              '- safe',
              'Pairing disabled because Telegram is running in public-safe mode.',
              '"access_mode": "public-safe"',
              '"tool_profile": "safe"',
              'HERMES_EXEC_ASK',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing safety markers: {missing}')
          print('Public-safe Telegram markers verified.')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/ai_stack.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Make Telegram public with safe tools only"
          git push
