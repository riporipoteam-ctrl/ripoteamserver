name: Snapshot Telegram status

on:
  push:
    branches: [main]
    paths:
      - ".verification/snapshot-telegram-status.txt"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe public AI status
        run: |
          set -euo pipefail
          curl -L -sS --max-time 60 'https://echoxr-ripoteam-cloud-pc.hf.space/api/ai/status?snapshot=1' -o /tmp/ai.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/ai.json').read_text())
          safe={
            'model': d.get('model'),
            'ollama': d.get('ollama'),
            'hermes': d.get('hermes'),
            'telegram': d.get('telegram'),
            'bootstrap': d.get('bootstrap'),
          }
          print(json.dumps(safe, indent=2))
          PY
