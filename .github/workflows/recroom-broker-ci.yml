name: Rec Room Broker CI

on:
  push:
    branches:
      - main
      - feat/recroom-session-broker
    paths:
      - "hf-space/recroom_autoload.py"
      - "hf-space/recroom_compat.py"
      - "hf-space/recroom_compat_extra.py"
      - "hf-space/recroom_room_compat.py"
      - "hf-space/recroom_match_model.py"
      - "hf-space/recroom_match_compat.py"
      - "hf-space/recroom_photon_compat.py"
      - "hf-space/recroom_service_aliases.py"
      - "hf-space/recroom_service_extra_aliases.py"
      - "hf-space/recroom_leaderboard_compat.py"
      - "hf-space/recroom_route_order.py"
      - "hf-space/recroom_broker.py"
      - "hf-space/recroom_capture.py"
      - "hf-space/recroom_gateway.py"
      - "hf-space/recroom_public.py"
      - "hf-space/sitecustomize.py"
      - "hf-space/app_server_v2.py"
      - "windows-live-agent/**"
      - ".github/workflows/recroom-broker-ci.yml"
  pull_request:
    paths:
      - "hf-space/recroom_autoload.py"
      - "hf-space/recroom_compat.py"
      - "hf-space/recroom_compat_extra.py"
      - "hf-space/recroom_room_compat.py"
      - "hf-space/recroom_match_model.py"
      - "hf-space/recroom_match_compat.py"
      - "hf-space/recroom_photon_compat.py"
      - "hf-space/recroom_service_aliases.py"
      - "hf-space/recroom_service_extra_aliases.py"
      - "hf-space/recroom_leaderboard_compat.py"
      - "hf-space/recroom_route_order.py"
      - "hf-space/recroom_broker.py"
      - "hf-space/recroom_capture.py"
      - "hf-space/recroom_gateway.py"
      - "hf-space/recroom_public.py"
      - "hf-space/sitecustomize.py"
      - "hf-space/app_server_v2.py"
      - "windows-live-agent/**"
      - ".github/workflows/recroom-broker-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Rec Room Python
        run: >-
          python -m py_compile
          hf-space/recroom_autoload.py
          hf-space/recroom_compat.py
          hf-space/recroom_compat_extra.py
          hf-space/recroom_room_compat.py
          hf-space/recroom_match_model.py
          hf-space/recroom_match_compat.py
          hf-space/recroom_photon_compat.py
          hf-space/recroom_service_aliases.py
          hf-space/recroom_service_extra_aliases.py
          hf-space/recroom_leaderboard_compat.py
          hf-space/recroom_route_order.py
          hf-space/recroom_broker.py
          hf-space/recroom_capture.py
          hf-space/recroom_gateway.py
          hf-space/recroom_public.py
          hf-space/sitecustomize.py
          hf-space/app_server_v2.py
          windows-live-agent/recroom-web-stream.py
      - name: Validate compatibility route source invariants
        run: |
          grep -q 'VersionStatus' hf-space/recroom_compat.py
          grep -q 'Screens.ForceVerification' hf-space/recroom_compat.py
          grep -q 'openid-configuration/jwks' hf-space/recroom_compat.py
          grep -q 'Matchmaking/player/qos' hf-space/recroom_compat.py
          grep -q 'Room_server/rooms/{room_id}' hf-space/recroom_compat.py
          grep -q 'api/gameconfigs/v1/all' hf-space/recroom_compat_extra.py
          grep -q 'api/relationships/v2/get' hf-space/recroom_compat_extra.py
          grep -q 'outfits/me/saved' hf-space/recroom_compat_extra.py
          grep -q 'econ/roomInventory/room/{room_id}' hf-space/recroom_compat_extra.py
          grep -q 'c79709d8-a31b-48aa-9eb8-cc31ba9505e8' hf-space/recroom_match_model.py
          grep -q '76d98498-60a1-430c-ab76-b54a29b7a163' hf-space/recroom_match_model.py
          grep -q 'Room_server/dormroom/me' hf-space/recroom_room_compat.py
          grep -q 'Room_server/rooms/{room_id}' hf-space/recroom_room_compat.py
          grep -q 'Matchmaking/matchmake/dorm' hf-space/recroom_match_compat.py
          grep -q 'Matchmaking/player/heartbeat' hf-space/recroom_match_compat.py
          grep -q 'roomInstance' hf-space/recroom_match_compat.py
          grep -q 'photonRoomId' hf-space/recroom_match_compat.py
          grep -q 'matchMakingPolicy' hf-space/recroom_match_compat.py
          grep -q 'Room_server/photon_access_token' hf-space/recroom_photon_compat.py
          grep -q 'api/rooms/v1/photon_access_token' hf-space/recroom_photon_compat.py
          grep -q 'PhotonAccessToken' hf-space/recroom_photon_compat.py
          grep -q 'RoomInstanceId' hf-space/recroom_photon_compat.py
          grep -q 'Permissions' hf-space/recroom_photon_compat.py
          grep -q '/player/login' hf-space/recroom_service_aliases.py
          grep -q '/account/me' hf-space/recroom_service_aliases.py
          grep -q '/matchmake/dorm' hf-space/recroom_service_aliases.py
          grep -q '/photon_access_token' hf-space/recroom_service_aliases.py
          grep -q '/playersettings' hf-space/recroom_service_extra_aliases.py
          grep -q '/roomInventory/player' hf-space/recroom_service_extra_aliases.py
          grep -q '/api/catalog/v1/all' hf-space/recroom_service_extra_aliases.py
          grep -q '/hub/v1' hf-space/recroom_service_extra_aliases.py
          grep -q '/club/home/me' hf-space/recroom_service_extra_aliases.py
          grep -q '/leaderboard/GetPlayerRank' hf-space/recroom_leaderboard_compat.py
          grep -q '/leaderboard/GetNearbyScores' hf-space/recroom_leaderboard_compat.py
          grep -q 'GlobalOverall' hf-space/recroom_leaderboard_compat.py
          grep -q '/rooms/{room_id}' hf-space/recroom_route_order.py
      - name: Validate Windows agent PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "windows-live-agent/install-recroom-host.ps1",
            "windows-live-agent/identify-recroom-client.ps1",
            "windows-live-agent/recroom-agent.ps1",
            "windows-live-agent/recroom-capture-agent.ps1",
            "windows-live-agent/playtest-recroom-client.ps1",
            "windows-live-agent/start-recroom-host.ps1",
            "windows-live-agent/update-recroom-host.ps1",
            "windows-live-agent/bootstrap-recroom-host.ps1",
            "windows-live-agent/download-recroom-client.ps1",
            "windows-live-agent/start-recroom-browser-stream.ps1",
            "windows-live-agent/stop-recroom-browser-stream.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script :: $($_.Message)" }
              exit 1
            }
          }
      - name: Validate host config JSON and stable update branch
        shell: pwsh
        run: |
          $cfg = Get-Content "windows-live-agent/recroom-agent-config.example.json" -Raw | ConvertFrom-Json
          if ($cfg.updateRef -ne "main") { throw "Rec Room hosts must auto-update from main." }
          if (-not $cfg.streamStartCommand -or -not $cfg.streamStopCommand) { throw "Built-in browser stream commands are required." }
      - name: Verify automatic host assets are present
        run: |
          test -f windows-live-agent/install-recroom-host.ps1
          test -f windows-live-agent/identify-recroom-client.ps1
          test -f windows-live-agent/recroom-web-stream.py
          test -f windows-live-agent/playtest-recroom-client.ps1
          test -f windows-live-agent/bootstrap-recroom-host.ps1
          test -f windows-live-agent/download-recroom-client.ps1
          test -f windows-live-agent/start-recroom-browser-stream.ps1
          test -f windows-live-agent/stop-recroom-browser-stream.ps1
          grep -q 'Pillow' windows-live-agent/requirements.txt
          grep -q '6337851004861751095' windows-live-agent/download-recroom-client.ps1
          grep -q 'identify-recroom-client.ps1' windows-live-agent/install-recroom-host.ps1
          grep -q 'identify-recroom-client.ps1' windows-live-agent/update-recroom-host.ps1
          grep -q 'redirect-client-urls.mjs' windows-live-agent/install-recroom-host.ps1
          grep -q 'playtest-recroom-client.ps1' windows-live-agent/update-recroom-host.ps1