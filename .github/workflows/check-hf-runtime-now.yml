name: Check Hugging Face runtime now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-hf-runtime-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query public Space runtime
        run: |
          echo "Runtime probe revision 4"
          python -m pip install --quiet --upgrade huggingface_hub
          python - <<'PY' > /tmp/runtime.txt
          import json
          from dataclasses import asdict, is_dataclass
          from huggingface_hub import HfApi

          info = HfApi().space_info("Echoxr/ripoteam-cloud-pc", expand=["runtime", "sha", "lastModified", "siblings"])
          runtime = info.runtime
          if is_dataclass(runtime):
              runtime = asdict(runtime)
          elif hasattr(runtime, "__dict__"):
              runtime = runtime.__dict__
          print(json.dumps({
              "sha": info.sha,
              "last_modified": str(info.last_modified),
              "runtime": runtime,
          }, indent=2, default=str))
          PY
          cat /tmp/runtime.txt

      - name: Save runtime result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p .deployment-status
          cp /tmp/runtime.txt .deployment-status/runtime-now.json
          git add .deployment-status/runtime-now.json
          git commit -m "Record current Hugging Face runtime" || true
          git push
