name: Check Hugging Face runtime now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-hf-runtime-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query public Space runtime and routes
        run: |
          echo "Runtime probe revision 7"
          python -m pip install --quiet --upgrade huggingface_hub
          python - <<'PY' > /tmp/runtime.txt
          import json
          from dataclasses import asdict, is_dataclass
          from huggingface_hub import HfApi

          info = HfApi().space_info("Echoxr/ripoteam-cloud-pc", expand=["runtime", "sha", "lastModified", "siblings"])
          runtime = info.runtime
          if is_dataclass(runtime):
              runtime = asdict(runtime)
          elif hasattr(runtime, "__dict__"):
              runtime = runtime.__dict__
          print(json.dumps({
              "sha": info.sha,
              "last_modified": str(info.last_modified),
              "runtime": runtime,
          }, indent=2, default=str))
          PY

          BASE="https://echoxr-ripoteam-cloud-pc.hf.space"
          {
            echo "root_status=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --max-time 30 "$BASE/")"
            echo "health_status=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$BASE/api/health")"
            echo "novnc_status=$(curl -L -sS -o /tmp/vnc.html -w '%{http_code}' --max-time 30 "$BASE/novnc/vnc.html")"
          } > /tmp/routes.txt

          cat /tmp/runtime.txt
          cat /tmp/routes.txt
          cat /tmp/health.json || true

      - name: Save runtime result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p .deployment-status
          {
            cat /tmp/runtime.txt
            echo
            echo "PUBLIC ROUTES"
            cat /tmp/routes.txt
            echo
            echo "HEALTH RESPONSE"
            cat /tmp/health.json || true
          } > .deployment-status/runtime-now.json
          git add .deployment-status/runtime-now.json
          git commit -m "Record current Hugging Face runtime and routes" || true
          git push
