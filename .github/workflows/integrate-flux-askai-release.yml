name: Integrate Flux AskAI release

on:
  push:
    branches: [flux-askai-release]
    paths:
      - "hf-space/flux_askai.py"
      - ".github/workflows/integrate-flux-askai-release.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flux-askai-release
      - name: Wire AskAI routes into the current server app
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('hf-space/app.py')
          text = app.read_text(encoding='utf-8')
          imp = 'from flux_askai import install_flux_askai_routes\n'
          if imp not in text:
              text = text.replace('from ai_stack import AIStack\n', 'from ai_stack import AIStack\n' + imp, 1)
          route = 'install_flux_askai_routes(app, AI_STACK)\n'
          if route not in text:
              text = text.replace(
                  'install_desktop_routes(app, password=VNC_PASSWORD, display=DISPLAY)\n',
                  'install_desktop_routes(app, password=VNC_PASSWORD, display=DISPLAY)\n' + route,
                  1,
              )
          text = text.replace(
              'allow_headers=["content-type", "x-admin-token"],',
              'allow_headers=["content-type", "authorization", "x-admin-token"],',
              1,
          )
          app.write_text(text, encoding='utf-8')
          PY
          python -m py_compile hf-space/app.py hf-space/flux_askai.py
      - name: Commit integrated server app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/integrate-flux-askai-release.yml
          git add hf-space/app.py .github/workflows/integrate-flux-askai-release.yml
          git commit -m "Wire Flux AskAI into current server"
          git push origin HEAD:flux-askai-release
