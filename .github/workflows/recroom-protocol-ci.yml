name: Rec Room Protocol CI

on:
  push:
    branches: [main]
    paths:
      - "hf-space/recroom_gateway.py"
      - "hf-space/recroom_compat.py"
      - "hf-space/recroom_compat_extra.py"
      - "hf-space/recroom_room_compat.py"
      - "hf-space/recroom_match_model.py"
      - "hf-space/recroom_match_compat.py"
      - ".github/workflows/recroom-protocol-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protocol test dependencies
        run: python -m pip install --disable-pip-version-check fastapi 'httpx<0.28' requests cryptography
      - name: Exercise fresh-account Orientation then Dorm flow
        env:
          RECROOM_PHOTON_APP_ID: ci-photon-app
          RECROOM_PHOTON_APP_VERSION: "0.2"
          RECROOM_PHOTON_REGION: eu
        run: |
          PYTHONPATH=hf-space python - <<'PY'
          import hashlib
          import tempfile
          import time
          from pathlib import Path

          from fastapi import FastAPI
          from fastapi.testclient import TestClient

          from recroom_gateway import NativeSession, RecRoomGateway, install_recroom_gateway_routes
          from recroom_compat import install_recroom_compat_routes
          from recroom_compat_extra import install_recroom_extra_routes
          from recroom_room_compat import install_recroom_room_compat_routes
          from recroom_match_compat import install_recroom_match_compat_routes
          from recroom_match_model import (
              DORM_SCENE_LOCATION_ID,
              ORIENTATION_INSTANCE_ID,
              ORIENTATION_ROOM_ID,
              ORIENTATION_SCENE_LOCATION_ID,
              ORIENTATION_SUBROOM_ID,
          )

          root=Path(tempfile.mkdtemp(prefix='rr-protocol-'))
          gateway=RecRoomGateway(root)
          gateway._write_recroom_state=lambda _session: None

          token='ci-native-session-token'
          session=NativeSession(
              token=token,
              uid='ci-uid',
              email='ci@example.com',
              username='ci_player',
              display_name='CI Player',
              account_id=77,
              is_admin=False,
              firebase_token='ci-firebase-token',
              expires_at=time.time()+3600,
              state={},
          )
          gateway.sessions[hashlib.sha256(token.encode()).hexdigest()]=session

          app=FastAPI()
          install_recroom_gateway_routes(app,gateway)
          install_recroom_compat_routes(app,gateway)
          install_recroom_extra_routes(app,gateway)
          install_recroom_room_compat_routes(app,gateway)
          install_recroom_match_compat_routes(app,gateway)
          client=TestClient(app)
          headers={'authorization':f'Bearer {token}'}

          cfg=client.get('/api/config/v2').json()
          assert isinstance(cfg,list), cfg
          values={x['Key']:x['Value'] for x in cfg}
          assert values['BuildId']=='8751857', values
          assert values['Screens.ForceVerification']=='0', values

          me=client.get('/Accounts/account/me',headers=headers)
          assert me.status_code==200, me.text
          account=me.json()
          assert account['accountId']==77 and account['username']=='ci_player', account

          # A brand-new account has no lastRoomId. The client loads Orientation
          # locally and heartbeat must preserve the sentinel -2 presence.
          fresh=client.post('/Matchmaking/player/heartbeat',headers=headers,json={})
          assert fresh.status_code==200, fresh.text
          first=fresh.json()
          ori=first['roomInstance']
          assert ori['roomInstanceId']==ORIENTATION_INSTANCE_ID, ori
          assert ori['roomId']==ORIENTATION_ROOM_ID, ori
          assert ori['subRoomId']==ORIENTATION_SUBROOM_ID, ori
          assert ori['location']==ORIENTATION_SCENE_LOCATION_ID, ori
          assert ori['photonRoomId']=='rec.13', ori
          assert ori['name']=='^Orientation', ori
          assert ori['isPrivate'] is False, ori
          assert 'lastRoomId' not in session.state, session.state

          orientation_meta=client.get('/Room_server/rooms/13',headers=headers)
          assert orientation_meta.status_code==200, orientation_meta.text
          om=orientation_meta.json()
          assert om['RoomId']==ORIENTATION_ROOM_ID and om['Name']=='Orientation', om
          assert om['SubRooms'][0]['SubRoomId']==ORIENTATION_SUBROOM_ID, om
          assert om['SubRooms'][0]['UnitySceneId']==ORIENTATION_SCENE_LOCATION_ID, om
          assert om['Scenes'][0]['RoomSceneLocationId']==ORIENTATION_SCENE_LOCATION_ID, om

          orientation_instance=client.get('/Matchmaking/roominstance/-2',headers=headers)
          assert orientation_instance.status_code==200, orientation_instance.text
          assert orientation_instance.json()['roomInstanceId']==ORIENTATION_INSTANCE_ID, orientation_instance.text

          # Dorm metadata may be requested while Orientation is active; this must
          # not mark onboarding complete or change lastRoomId.
          dorm_meta=client.get('/Room_server/dormroom/me',headers=headers)
          assert dorm_meta.status_code==200, dorm_meta.text
          meta=dorm_meta.json()
          assert meta['IsDormRoom'] is True, meta
          assert meta['SubRooms'][0]['UnitySceneId']==DORM_SCENE_LOCATION_ID, meta
          assert session.state['dormRoomId']==meta['RoomId'], session.state
          assert 'lastRoomId' not in session.state, session.state

          fresh2=client.post('/Matchmaking/player/heartbeat',headers=headers,json={}).json()
          assert fresh2['roomInstance']['roomInstanceId']==ORIENTATION_INSTANCE_ID, fresh2
          assert fresh2['roomInstance']['location']==ORIENTATION_SCENE_LOCATION_ID, fresh2

          # Entering Dorm is the explicit transition out of first-run Orientation.
          dorm=client.post('/Matchmaking/matchmake/dorm',headers=headers,json={})
          assert dorm.status_code==200, dorm.text
          body=dorm.json()
          assert body['errorCode']==0 and isinstance(body['roomInstance'],dict), body
          room=body['roomInstance']
          required={
              'roomInstanceId','roomId','subRoomId','location','photonRegionId','photonRegion','photonRoomId','name',
              'maxCapacity','isFull','isPrivate','isInProgress','roomInstanceType','isMatchmakingSocial',
              'dataBlobName','dataBlobChecksum','dataBlob','matchmakingPolicy','matchMakingPolicy','inviteCode'
          }
          assert required.issubset(room), room
          assert 1 <= int(room['roomInstanceId']) <= 999_999_999, room
          assert room['location']==DORM_SCENE_LOCATION_ID, room
          assert room['subRoomId']==1 and room['isPrivate'] is True, room
          assert room['photonRegionId']=='eu' and room['photonRegion']=='eu', room
          assert isinstance(room['photonRoomId'],str) and room['photonRoomId'], room
          assert room['matchmakingPolicy']==0 and room['matchMakingPolicy']==0, room
          assert session.state['lastRoomId']==room['roomId'], session.state

          heartbeat=client.post('/Matchmaking/player/heartbeat',headers=headers,json={})
          assert heartbeat.status_code==200, heartbeat.text
          hb=heartbeat.json()
          assert hb['player']['accountId']==77, hb
          assert hb['player']['platform']==-1, hb
          assert hb['roomInstance']['roomInstanceId']==room['roomInstanceId'], (room,hb)
          assert hb['roomInstance']['roomId']==room['roomId'], (room,hb)
          assert hb['roomInstance']['location']==DORM_SCENE_LOCATION_ID, hb

          active=client.get(f"/Matchmaking/roominstance/{room['roomInstanceId']}",headers=headers)
          assert active.status_code==200 and active.json()['roomInstanceId']==room['roomInstanceId'], active.text
          assert isinstance(active.json()['photonRoomId'],str), active.text

          hot=client.get('/Room_server/rooms/hot',headers=headers)
          assert hot.status_code==200 and hot.json()==[], hot.text
          owned=client.get('/Room_server/rooms/ownedby/me',headers=headers)
          assert owned.status_code==200 and owned.json()==[], owned.text

          auth=client.post('/Auth/connect/token',headers=headers,data={})
          assert auth.status_code==200, auth.text
          access=auth.json()['access_token']
          assert access.count('.')==2, access
          jwks=client.get('/Auth/.well-known/openid-configuration/jwks').json()
          assert jwks['keys'][0]['alg']=='RS256' and jwks['keys'][0]['kty']=='RSA', jwks

          print('RECROOM_FRESH_ACCOUNT_ORIENTATION_OK=true')
          print('orientationInstance=',ori['roomInstanceId'])
          print('orientationScene=',ori['location'])
          print('RECROOM_ORIENTATION_TO_DORM_OK=true')
          print('dormInstance=',room['roomInstanceId'])
          print('dormScene=',room['location'])
          PY
