name: Rec Room Native Live Launch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recroom-native-live-launch.yml"

permissions:
  contents: read

jobs:
  native-live-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
      FIREBASE_API_KEY: AIzaSyBV_ev8AVpKwgioPSSWiBYf8UU09bLbWOU
    steps:
      - name: Allocate, launch, capture and release exact May 2022 client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rr-live
          SESSION_ID=''
          ACCESS_TOKEN=''
          FIREBASE_TOKEN=''

          cleanup() {
            set +e
            if [ -n "$SESSION_ID" ] && [ -n "$ACCESS_TOKEN" ]; then
              curl -fsS --max-time 20 -X POST \
                "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/release?accessToken=$ACCESS_TOKEN" \
                -o /tmp/rr-live/release.json || true
              echo '--- release ---'
              cat /tmp/rr-live/release.json 2>/dev/null || true
            fi
            if [ -n "$FIREBASE_TOKEN" ]; then
              curl -fsS --max-time 20 -X POST \
                "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$FIREBASE_API_KEY" \
                -H 'content-type: application/json' \
                --data "$(jq -cn --arg t "$FIREBASE_TOKEN" '{idToken:$t}')" \
                -o /tmp/rr-live/firebase-delete.json || true
              echo '--- temporary Firebase identity cleanup ---'
              cat /tmp/rr-live/firebase-delete.json 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo 'Creating disposable email/password Flux test identity...'
          TEST_EMAIL="recroom-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          TEST_PASSWORD="Rr!$(openssl rand -hex 18)"
          AUTH_BODY="$(jq -cn --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" \
            '{email:$email,password:$password,returnSecureToken:true}')"
          AUTH_CODE="$(curl -sS --max-time 30 -o /tmp/rr-live/firebase-auth.json -w '%{http_code}' \
            -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$FIREBASE_API_KEY" \
            -H 'content-type: application/json' \
            --data "$AUTH_BODY")"
          jq '{localId,email,error}' /tmp/rr-live/firebase-auth.json
          test "$AUTH_CODE" = '200'
          FIREBASE_TOKEN="$(jq -r '.idToken // empty' /tmp/rr-live/firebase-auth.json)"
          test -n "$FIREBASE_TOKEN"
          echo "TEMP_FIREBASE_UID=$(jq -r '.localId // empty' /tmp/rr-live/firebase-auth.json)"

          echo 'Allocating exact May 19 2022 server-stream session...'
          CREATE_CODE="$(curl -sS --max-time 45 -o /tmp/rr-live/session-create.json -w '%{http_code}' \
            -X POST "$SPACE_URL/api/recroom-public/sessions" \
            -H "authorization: Bearer $FIREBASE_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"buildId":"recroom-2022-05-19"}')"
          jq '{ok,mode,sessionId,state,hostId,buildId,provider,phase,progress,error}' /tmp/rr-live/session-create.json
          test "$CREATE_CODE" = '202'
          SESSION_ID="$(jq -r '.sessionId // empty' /tmp/rr-live/session-create.json)"
          ACCESS_TOKEN="$(jq -r '.sessionAccessToken // .accessToken // empty' /tmp/rr-live/session-create.json)"
          test -n "$SESSION_ID"
          test -n "$ACCESS_TOKEN"
          echo "RECROOM_SESSION_ID=$SESSION_ID"

          echo 'Polling real Wine/Rec Room launch...'
          READY='0'
          for i in $(seq 1 72); do
            curl -fsS --max-time 20 \
              "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID?accessToken=$ACCESS_TOKEN" \
              -o /tmp/rr-live/session-status.json
            STATE="$(jq -r '.state // empty' /tmp/rr-live/session-status.json)"
            PHASE="$(jq -r '.phase // empty' /tmp/rr-live/session-status.json)"
            PROGRESS="$(jq -r '.progress // 0' /tmp/rr-live/session-status.json)"
            PROVIDER="$(jq -r '.provider // empty' /tmp/rr-live/session-status.json)"
            echo "launch[$i] state=$STATE phase=$PHASE progress=$PROGRESS provider=$PROVIDER"
            if [ "$STATE" = 'ready' ]; then
              READY='1'
              jq '{sessionId,state,provider,phase,progress,streamUrl,error}' /tmp/rr-live/session-status.json
              break
            fi
            if [ "$STATE" = 'failed' ]; then
              jq '{sessionId,state,provider,phase,progress,error}' /tmp/rr-live/session-status.json
              echo '::error::Rec Room runtime reported failed state.'
              exit 1
            fi
            sleep 4
          done
          test "$READY" = '1'
          jq -e '.provider == "ripoteam-wine"' /tmp/rr-live/session-status.json >/dev/null
          jq -e '.streamUrl | type == "string" and startswith("https://")' /tmp/rr-live/session-status.json >/dev/null
          echo 'RECROOM_NATIVE_STREAM_READY=true'

          echo 'Requesting screenshot from the live Rec Room sandbox...'
          CAP_CODE="$(curl -sS --max-time 30 -o /tmp/rr-live/capture-create.json -w '%{http_code}' \
            -X POST "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures?accessToken=$ACCESS_TOKEN")"
          jq '{captureId,state,error}' /tmp/rr-live/capture-create.json
          test "$CAP_CODE" = '202'
          CAPTURE_ID="$(jq -r '.captureId // empty' /tmp/rr-live/capture-create.json)"
          test -n "$CAPTURE_ID"

          CAPTURE_READY='0'
          for i in $(seq 1 30); do
            curl -fsS --max-time 20 \
              "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures/$CAPTURE_ID?accessToken=$ACCESS_TOKEN" \
              -o /tmp/rr-live/capture-status.json
            CAP_STATE="$(jq -r '.state // empty' /tmp/rr-live/capture-status.json)"
            echo "capture[$i] state=$CAP_STATE"
            if [ "$CAP_STATE" = 'ready' ]; then
              CAPTURE_READY='1'
              break
            fi
            if [ "$CAP_STATE" = 'failed' ]; then
              jq '{captureId,state,error}' /tmp/rr-live/capture-status.json
              exit 1
            fi
            sleep 2
          done
          test "$CAPTURE_READY" = '1'

          curl -fsS --max-time 30 \
            "$SPACE_URL/api/recroom-public/sessions/$SESSION_ID/captures/$CAPTURE_ID/image?accessToken=$ACCESS_TOKEN" \
            -o /tmp/rr-live/recroom-live.png
          file /tmp/rr-live/recroom-live.png
          test "$(stat -c '%s' /tmp/rr-live/recroom-live.png)" -gt 1000
          echo "RECROOM_CAPTURE_BYTES=$(stat -c '%s' /tmp/rr-live/recroom-live.png)"
          echo 'RECROOM_NATIVE_LIVE_E2E=true'

      - name: Upload live Rec Room proof screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recroom-may-2022-live-proof
          path: /tmp/rr-live/recroom-live.png
          if-no-files-found: ignore
          retention-days: 1
