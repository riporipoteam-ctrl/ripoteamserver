name: Update public Telegram dashboard

on:
  push:
    branches: [main]
    paths:
      - ".verification/update-public-telegram-ui.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python .github/scripts/update_public_telegram_ui.py
      - name: Validate dashboard
        run: |
          node --check site/app.js
          grep -F 'id="telegram-access-card"' site/index.html
          grep -F 'public-safe Telegram access' site/index.html
          grep -F 'publicTelegram' site/app.js
          grep -F 'Public · no pairing · safe tools' site/app.js
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/app.js site/sw.js
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
            exit 0
          fi
          git commit -m "Update dashboard for public Telegram mode"
          git push
