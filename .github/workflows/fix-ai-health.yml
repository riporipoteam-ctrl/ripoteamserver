name: Fix AI health summary

on:
  pull_request:
    branches: [main]
    paths:
      - ".verification/fix-ai-health.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch health response
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('hf-space/app.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '        "hermes": {\n            "installed": hermes_binary() is not None,'
          end_marker = '        "timestamp": time.time(),'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              '        "hermes": {\n'
              '            "installed": ai["hermes"]["installed"],\n'
              '            "running": ai["hermes"]["gateway_running"],\n'
              '            "skills": ai["hermes"]["skills"],\n'
              '            "plugins": ai["hermes"]["plugins"],\n'
              '        },\n'
              '        "ai": ai,\n'
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile hf-space/app.py hf-space/ai_stack.py
          grep -F '"ai": ai,' hf-space/app.py
          grep -F 'ai["hermes"]["gateway_running"]' hf-space/app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/app.py
          git commit -m "Expose local AI status in health endpoint"
          git pull --rebase origin main
          git push origin HEAD:main
