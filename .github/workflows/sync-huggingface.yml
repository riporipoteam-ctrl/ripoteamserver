name: Create or update Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-huggingface.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: huggingface-space-deployment
  cancel-in-progress: true

env:
  HF_SPACE_ID: Echoxr/ripoteam-cloud-pc
  HF_OIDC_RESOURCE: spaces/Echoxr/ripoteam-cloud-pc
  SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload Space through trusted publishing
        id: upload
        continue-on-error: true
        run: |
          set -euo pipefail
          hf upload "$HF_SPACE_ID" hf-space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy Ripo Team Cloud PC from ${GITHUB_SHA::7}"

      - name: Inspect Space immediately after upload
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: hf spaces info "$HF_SPACE_ID"

      - name: Wait for Hugging Face runtime
        id: runtime
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          hf spaces wait "$HF_SPACE_ID" --timeout 8m

      - name: Capture Space runtime information
        if: always()
        continue-on-error: true
        run: |
          set +e
          hf spaces info "$HF_SPACE_ID" 2>&1 | tee /tmp/space-info.txt
          hf spaces logs "$HF_SPACE_ID" --build -n 250 2>&1 | tee /tmp/build-logs.txt
          hf spaces logs "$HF_SPACE_ID" -n 250 2>&1 | tee /tmp/runtime-logs.txt
          exit 0

      - name: Test live health endpoint
        id: health
        if: steps.upload.outcome == 'success' && steps.runtime.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$SPACE_URL/api/health" \
            -o /tmp/last-health.txt
          python -m json.tool /tmp/last-health.txt

      - name: Record deployment result
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p .deployment-status
          {
            echo "Hugging Face deployment: ${UPLOAD_OUTCOME}"
            echo "Hugging Face runtime wait: ${RUNTIME_OUTCOME}"
            echo "Hugging Face Space health: ${HEALTH_OUTCOME}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for file in /tmp/space-info.txt /tmp/build-logs.txt /tmp/runtime-logs.txt /tmp/last-health.txt; do
              if [ -s "$file" ]; then
                echo
                echo "===== $(basename "$file") ====="
                tail -n 250 "$file"
              fi
            done
          } > .deployment-status/huggingface.txt
          git add .deployment-status/huggingface.txt
          git commit -m "Record Hugging Face runtime diagnostics" || true
          git push

      - name: Fail if deployment is not healthy
        if: steps.upload.outcome != 'success' || steps.runtime.outcome != 'success' || steps.health.outcome != 'success'
        run: exit 1
