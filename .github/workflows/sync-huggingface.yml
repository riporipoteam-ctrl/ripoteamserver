name: Create or update Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-huggingface.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: huggingface-space-deployment
  cancel-in-progress: true

env:
  HF_SPACE_ID: Echoxr/ripoteam-cloud-pc
  HF_OIDC_RESOURCE: spaces/Echoxr/ripoteam-cloud-pc
  SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exchange GitHub OIDC identity for a short-lived Hub token
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://huggingface.co" \
            | jq -r .value)

          HEADERS=$(mktemp)
          BODY=$(mktemp)
          STATUS=$(curl -sS -D "$HEADERS" -o "$BODY" -w '%{http_code}' \
            -X POST "https://huggingface.co/oauth/token" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$ID_TOKEN" --arg r "$HF_OIDC_RESOURCE" \
              '{
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
                subject_token: $t,
                resource: $r
              }')")"

          if [ "$STATUS" -ne 200 ]; then
            REQUEST_ID=$(grep -i '^x-request-id:' "$HEADERS" | sed 's/.*: *//' | tr -d '\r')
            echo "::error::Hugging Face token exchange failed with HTTP $STATUS (request ${REQUEST_ID:-unknown})"
            cat "$BODY"
            exit 1
          fi

          HF_TOKEN=$(jq -r .access_token "$BODY")
          test -n "$HF_TOKEN"
          test "$HF_TOKEN" != "null"
          echo "::add-mask::$HF_TOKEN"
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "HF_TOKEN<<$DELIM"
            echo "$HF_TOKEN"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Upload Space through trusted publishing
        id: upload
        continue-on-error: true
        run: |
          set -euo pipefail
          hf upload "$HF_SPACE_ID" hf-space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy Ripo Team Cloud PC from ${GITHUB_SHA::7}"

      - name: Inspect Space immediately after upload
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: hf spaces info "$HF_SPACE_ID"

      - name: Wait for Hugging Face runtime
        id: runtime
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          hf spaces wait "$HF_SPACE_ID" --timeout 8m

      - name: Capture Space runtime information
        if: always()
        continue-on-error: true
        run: |
          set +e
          hf spaces info "$HF_SPACE_ID" 2>&1 | tee /tmp/space-info.txt
          hf spaces logs "$HF_SPACE_ID" --build -n 300 2>&1 | tee /tmp/build-logs.txt
          hf spaces logs "$HF_SPACE_ID" -n 300 2>&1 | tee /tmp/runtime-logs.txt
          exit 0

      - name: Test live health endpoint
        id: health
        if: steps.upload.outcome == 'success' && steps.runtime.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$SPACE_URL/api/health" \
            -o /tmp/last-health.txt
          python -m json.tool /tmp/last-health.txt

      - name: Test live Rec Room runtime
        id: recroom
        if: steps.upload.outcome == 'success' && steps.runtime.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$SPACE_URL/api/recroom-public/status" \
            -o /tmp/recroom-status.json
          python -m json.tool /tmp/recroom-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/recroom-status.json').read_text())
          assert data.get('ok') is True, data
          runtime = data.get('serverRuntime') or data.get('vmRuntime') or data.get('wineRuntime') or data.get('kvmRuntime') or {}
          assert data.get('configured') is True, data
          assert data.get('runtimeReadyForGame') is True or data.get('vmReadyForGame') is True or runtime.get('readyForGame') is True, data
          print('Rec Room runtime is configured and game-ready on the live backend.')
          PY

      - name: Test TikTok OAuth endpoint
        id: tiktok
        if: steps.upload.outcome == 'success' && steps.runtime.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$SPACE_URL/api/tiktok/status" \
            -o /tmp/tiktok-status.json
          python -m json.tool /tmp/tiktok-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/tiktok-status.json').read_text())
          assert data.get('ok') is True, data
          assert data.get('oauth_configured') is True, data
          print('TikTok OAuth is configured on the live backend.')
          PY

      - name: Record deployment result
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          RECROOM_OUTCOME: ${{ steps.recroom.outcome }}
          TIKTOK_OUTCOME: ${{ steps.tiktok.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p .deployment-status
          {
            echo "Hugging Face deployment: ${UPLOAD_OUTCOME}"
            echo "Hugging Face runtime wait: ${RUNTIME_OUTCOME}"
            echo "Hugging Face Space health: ${HEALTH_OUTCOME}"
            echo "Hugging Face Rec Room runtime: ${RECROOM_OUTCOME}"
            echo "TikTok OAuth verification: ${TIKTOK_OUTCOME}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for file in /tmp/space-info.txt /tmp/build-logs.txt /tmp/runtime-logs.txt /tmp/last-health.txt /tmp/recroom-status.json /tmp/tiktok-status.json; do
              if [ -s "$file" ]; then
                echo
                echo "===== $(basename "$file") ====="
                tail -n 300 "$file"
              fi
            done
          } > .deployment-status/huggingface.txt
          git add .deployment-status/huggingface.txt
          git commit -m "Record Hugging Face runtime diagnostics" || true
          git push

      - name: Fail if deployment is not healthy
        if: steps.upload.outcome != 'success' || steps.runtime.outcome != 'success' || steps.health.outcome != 'success' || steps.recroom.outcome != 'success' || steps.tiktok.outcome != 'success'
        run: exit 1
