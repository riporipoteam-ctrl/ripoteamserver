name: Create or update Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-huggingface.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Create or update Gradio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'Echoxr/ripoteam-cloud-pc' }}
          HF_VNC_PASSWORD: ${{ secrets.HF_VNC_PASSWORD }}
          HF_ADMIN_TOKEN: ${{ secrets.HF_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          if not token:
              raise SystemExit("HF_TOKEN GitHub secret is missing.")

          repo_id = os.environ["HF_SPACE_REPO"]
          api = HfApi(token=token)

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              private=False,
              exist_ok=True,
          )
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="hf-space",
              commit_message="Deploy Ripo Team Cloud PC",
          )

          vnc_password = os.environ.get("HF_VNC_PASSWORD")
          admin_token = os.environ.get("HF_ADMIN_TOKEN")
          if vnc_password:
              api.add_space_secret(repo_id, key="VNC_PASSWORD", value=vnc_password)
          if admin_token:
              api.add_space_secret(repo_id, key="ADMIN_TOKEN", value=admin_token)

          print(f"Deployed Hugging Face Space: {repo_id}")
          PY
