name: Rec Room Windows Host CI

on:
  push:
    branches: [main]
    paths:
      - "windows-live-agent/**"
      - ".github/workflows/recroom-windows-host-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stream:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stream dependency
        run: python -m pip install "Pillow>=10,<12"
      - name: Exercise real one-command installer and strict client discovery
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "May 19 2022"
          New-Item -ItemType Directory -Force -Path (Join-Path $fake "Recroom_Release_Data\il2cpp_data\Metadata") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $fake "Recroom_Release.exe") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $fake "GameAssembly.dll") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $fake "Recroom_Release_Data\il2cpp_data\Metadata\global-metadata.dat") | Out-Null
          $env:FLUX_RECROOM_CLIENT_DIR = $fake
          $env:RECROOM_HOST_KEY = "ci-test-only"
          $installDir = Join-Path $env:RUNNER_TEMP "RipoTeamRecRoomHost"
          & .\windows-live-agent\install-recroom-host.ps1 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = Join-Path $installDir "recroom-agent-config.json"
          if (-not (Test-Path $config)) { throw "One-command installer did not create the host config." }
          $cfg = Get-Content $config -Raw | ConvertFrom-Json
          if ($cfg.clientDir -ne $fake) { throw "Installer did not preserve discovered client directory." }
          if ($cfg.updateRef -ne "main") { throw "Installer generated a stale update ref." }
          if ($cfg.hostKey -ne "ci-test-only") { throw "Installer did not preserve the paired host credential." }
          if (-not $cfg.streamStartCommand -or -not $cfg.streamStopCommand) { throw "Installer did not configure automatic streaming." }

          $finder = Join-Path $installDir "identify-recroom-client.ps1"
          if (-not (Test-Path -LiteralPath $finder -PathType Leaf)) { throw "Installer did not ship identify-recroom-client.ps1." }
          $rawIdentity = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $finder -Root $fake -AsJson
          if ($LASTEXITCODE -ne 0) { throw "Installed client identifier failed with exit $LASTEXITCODE." }
          try { $identity = ([string]($rawIdentity -join "`n")) | ConvertFrom-Json } catch { throw "Installed client identifier returned invalid JSON: $rawIdentity" }
          $preferred = $identity.preferred
          if (-not $preferred) { throw "Installed client identifier did not return a preferred client." }
          if ($preferred.kind -ne "target-2022") { throw "Strict client identifier classified the May 19 2022 fixture as '$($preferred.kind)'." }
          if (-not $preferred.playableBy2022Agent) { throw "Strict client identifier did not mark the May 19 2022 fixture playable by the 2022 agent." }
          if ($preferred.buildId -ne "8751857" -or $preferred.manifestId -ne "6337851004861751095") { throw "Strict client identifier returned the wrong target build/manifest." }
          Write-Host "STRICT_CLIENT_IDENTITY_OK=true kind=$($preferred.kind) confidence=$($preferred.confidence)"

          foreach ($required in @("start-recroom-host.ps1","update-recroom-host.ps1","identify-recroom-client.ps1","recroom-agent.ps1")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $required))) { throw "Installed host is missing $required." }
          }
          "RECROOM_INSTALL_DIR=$installDir" | Out-File $env:GITHUB_ENV -Append
      - name: Launch an input-aware Windows test game window
        shell: pwsh
        run: |
          $eventFile = Join-Path $env:RUNNER_TEMP "flux-input-events.log"
          $env:FLUX_INPUT_EVENT_FILE = $eventFile
          "INPUT_EVENT_FILE=$eventFile" | Out-File $env:GITHUB_ENV -Append
          @'
          import os
          import tkinter as tk
          from pathlib import Path

          event_file = Path(os.environ["FLUX_INPUT_EVENT_FILE"])
          event_file.write_text("READY\n", encoding="utf-8")

          def record(message):
              with event_file.open("a", encoding="utf-8") as f:
                  f.write(message + "\n")
                  f.flush()
              label.config(text=message)

          root = tk.Tk()
          root.title("Flux Rec Room Stream CI")
          root.geometry("900x600+40+40")
          root.configure(bg="#101622")
          label = tk.Label(root, text="FLUX REC ROOM INPUT TEST", fg="white", bg="#101622", font=("Arial", 28, "bold"))
          label.pack(expand=True)
          root.bind("<KeyPress>", lambda e: record(f"KEYDOWN:{e.keysym}"))
          root.bind("<KeyRelease>", lambda e: record(f"KEYUP:{e.keysym}"))
          root.bind("<ButtonPress>", lambda e: record(f"BUTTONDOWN:{e.num}"))
          root.bind("<ButtonRelease>", lambda e: record(f"BUTTONUP:{e.num}"))
          root.bind("<Motion>", lambda e: record(f"MOVE:{e.x}:{e.y}"))
          root.bind("<MouseWheel>", lambda e: record(f"WHEEL:{e.delta}"))
          root.after(250, root.focus_force)
          root.after(480000, root.destroy)
          root.mainloop()
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP "flux-test-window.py") -Encoding UTF8
          $window = Start-Process -FilePath python -ArgumentList @((Join-Path $env:RUNNER_TEMP "flux-test-window.py")) -PassThru
          "TEST_WINDOW_PID=$($window.Id)" | Out-File $env:GITHUB_ENV -Append
          Start-Sleep -Seconds 2
          if ($window.HasExited) { throw "Test window exited before stream validation." }
          if (-not (Test-Path $eventFile)) { throw "Input-aware test window did not create its event log." }
      - name: Start automatic HTTPS browser stream and exercise gameplay controls
        shell: pwsh
        run: |
          $env:FLUX_RECROOM_GAME_PID = $env:TEST_WINDOW_PID
          $startStream = Join-Path $env:RECROOM_INSTALL_DIR "start-recroom-browser-stream.ps1"
          $stopStream = Join-Path $env:RECROOM_INSTALL_DIR "stop-recroom-browser-stream.ps1"
          $lines = @(& $startStream)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $url = [string]($lines | Where-Object { $_ -match '^https://' } | Select-Object -Last 1)
          if (-not $url -or $url -notmatch '^https://.+\.trycloudflare\.com/\?token=') { throw "Automatic browser stream did not return a tokenized HTTPS URL: $url" }
          Write-Host "STREAM_URL_CREATED=true"

          $frameUrl = $url -replace '/\?token=', '/frame.jpg?token='
          $frameUrl += '&t=' + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $frame = Join-Path $env:RUNNER_TEMP "recroom-stream-frame.jpg"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $frameUrl -OutFile $frame -TimeoutSec 10
              if ((Test-Path $frame) -and (Get-Item $frame).Length -gt 1000) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw "Public HTTPS stream never returned a usable JPEG frame." }
          $bytes = [IO.File]::ReadAllBytes($frame)
          if ($bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8) { throw "Public frame was not JPEG data." }
          Write-Host "PUBLIC_FRAME_OK=true bytes=$($bytes.Length)"

          $inputUrl = $url -replace '/\?token=', '/input?token='
          function Send-Input($payload) {
            Invoke-RestMethod -Method Post -Uri $inputUrl -ContentType "application/json" -Body ($payload | ConvertTo-Json -Compress) -TimeoutSec 15 | Out-Null
          }

          Send-Input @{ type = "button"; button = "left"; down = $true; x = 0.5; y = 0.5 }
          Send-Input @{ type = "button"; button = "left"; down = $false }
          Send-Input @{ type = "key"; key = "w"; down = $true }
          Start-Sleep -Milliseconds 150
          Send-Input @{ type = "key"; key = "w"; down = $false }
          Send-Input @{ type = "move"; dx = 35; dy = 20 }
          Send-Input @{ type = "wheel"; delta = 1 }
          Send-Input @{ type = "release" }

          $received = $false
          for ($i = 0; $i -lt 20; $i++) {
            $events = Get-Content $env:INPUT_EVENT_FILE -Raw -ErrorAction SilentlyContinue
            if ($events -match 'KEYDOWN:w' -and $events -match 'KEYUP:w' -and $events -match 'BUTTONDOWN:1' -and $events -match 'BUTTONUP:1' -and $events -match 'MOVE:') {
              $received = $true
              break
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Host "WINDOW_INPUT_EVENTS:"
          Get-Content $env:INPUT_EVENT_FILE -ErrorAction SilentlyContinue | Select-Object -Last 30
          if (-not $received) { throw "Windows game window did not receive the complete remote keyboard/mouse control sequence." }
          Write-Host "PUBLIC_GAMEPLAY_INPUT_OK=true"
          & $stopStream
      - name: Verify stream processes cleaned up
        shell: pwsh
        run: |
          $state = Join-Path $env:RECROOM_INSTALL_DIR "recroom-stream-state.json"
          if (Test-Path $state) { throw "Stream state file survived cleanup." }
          Stop-Process -Id ([int]$env:TEST_WINDOW_PID) -Force -ErrorAction SilentlyContinue
