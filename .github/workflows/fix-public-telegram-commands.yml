name: Fix public Telegram commands

on:
  push:
    branches: [main]
    paths:
      - ".verification/fix-public-telegram-commands.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Telegram command permissions
        run: python .github/scripts/fix_public_telegram_commands.py
      - name: Validate Python and command list
        run: |
          python -m py_compile hf-space/ai_stack.py
          python - <<'PY'
          from pathlib import Path
          text = Path('hf-space/ai_stack.py').read_text(encoding='utf-8')
          for command in ('new', 'reset', 'status', 'model', 'commands', 'help', 'whoami'):
              assert f'- {command}' in text, command
          assert '- history' not in text
          print('Telegram public command policy validated.')
          PY
      - name: Commit command fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/ai_stack.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix public Telegram messaging commands"
          git push
