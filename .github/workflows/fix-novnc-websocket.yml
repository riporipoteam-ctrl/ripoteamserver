name: Install WebSocket-free HTTP desktop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-novnc-websocket.yml"
  pull_request:
    branches: [main]
    paths:
      - ".verification/http-desktop-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wire HTTP desktop routes into app
        run: |
          echo "HTTP desktop integration revision 4"
          python - <<'PY'
          from pathlib import Path

          path = Path("hf-space/app.py")
          text = path.read_text(encoding="utf-8")

          import_line = "from desktop_http import install_desktop_routes\n"
          if import_line not in text:
              anchor = "from gradio import Server\n"
              if anchor not in text:
                  raise SystemExit("Could not locate Gradio import")
              text = text.replace(anchor, import_line + anchor, 1)

          route_call = "install_desktop_routes(app, password=VNC_PASSWORD, display=DISPLAY)\n\n\n"
          if "install_desktop_routes(app" not in text:
              anchor = '@app.get("/api/health")\n'
              if anchor not in text:
                  raise SystemExit("Could not locate health route")
              text = text.replace(anchor, route_call + anchor, 1)

          text = text.replace(
              '/novnc/vnc.html?autoconnect=true&resize=scale&path=websockify',
              '/desktop',
          )
          text = text.replace("Open Linux desktop", "Open HTTPS Linux desktop")

          path.write_text(text, encoding="utf-8")
          print("HTTP desktop routes wired into app.py")
          PY

      - name: Validate source
        run: |
          python -m py_compile hf-space/app.py hf-space/desktop_http.py
          grep -F 'from desktop_http import install_desktop_routes' hf-space/app.py
          grep -F 'install_desktop_routes(app, password=VNC_PASSWORD, display=DISPLAY)' hf-space/app.py
          grep -F 'href="/desktop"' hf-space/app.py

      - name: Commit backend integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/app.py
          git commit -m "Enable WebSocket-free HTTP Linux desktop" || true
          git pull --rebase origin main
          git push origin HEAD:main
