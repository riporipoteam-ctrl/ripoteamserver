name: Check GitHub Pages now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-pages-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages
        run: |
          set -u
          URL="https://riporipoteam-ctrl.github.io/ripoteamserver/"
          : > /tmp/pages-body.html
          : > /tmp/pages-error.txt
          status="000"
          for attempt in $(seq 1 30); do
            status=$(curl -L -sS -o /tmp/pages-body.html -w '%{http_code}' --max-time 20 "$URL" 2>/tmp/pages-error.txt || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ] && grep -q "Ripo Team" /tmp/pages-body.html; then
              echo "Pages is live."
              break
            fi
            sleep 10
          done
          {
            echo "url=$URL"
            echo "http_status=$status"
            echo "contains_ripo_team=$(grep -qi 'Ripo Team' /tmp/pages-body.html && echo true || echo false)"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -s /tmp/pages-error.txt ]; then
              echo "last_error=$(tr '\n' ' ' < /tmp/pages-error.txt)"
            fi
          } > /tmp/pages-status.txt
          if [ "$status" != "200" ] || ! grep -qi "Ripo Team" /tmp/pages-body.html; then
            exit 1
          fi

      - name: Save Pages status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p .deployment-status
          cp /tmp/pages-status.txt .deployment-status/pages.txt
          git add .deployment-status/pages.txt
          git commit -m "Record GitHub Pages status" || true
          git push
