name: Test Windows TikTok LIVE Studio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-windows-live-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-live-studio-probe
  cancel-in-progress: true

jobs:
  test-live-studio:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Resolve and download official TikTok LIVE Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolver = 'https://tron-sg.bytelemon.com/api/sdk/check_update?pid=7393277106664249610&uid=&branch=studio/release/stable&buildId='
          $manifest = Invoke-RestMethod -Uri $resolver -Headers @{ 'User-Agent' = 'TikTok LIVE Studio' }
          $win = $manifest.data.manifest.win32
          $version = [string]$win.version
          $url = [string]$win.extra.downloaderConfig.url
          $expected = ([string]$win.extra.downloaderConfig.md5).ToLowerInvariant()
          if (-not $url.StartsWith('https://www.tiktok.com/tos-live-studio/releases/')) { throw "Unexpected package URL: $url" }
          $installer = Join-Path $env:RUNNER_TEMP 'tiktok-live-studio.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 10
          $actual = (Get-FileHash -Algorithm MD5 $installer).Hash.ToLowerInvariant()
          if ($expected -and $actual -ne $expected) { throw 'TikTok package checksum mismatch' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Verified TikTok LIVE Studio $version ($([math]::Round((Get-Item $installer).Length/1MB,1)) MB)"

      - name: Extract verified x64 package directly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { throw '7-Zip is not installed on this Windows runner.' }
          $root = Join-Path $env:RUNNER_TEMP 'live-studio-extracted'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & $seven x -y "-o$root" $env:INSTALLER | Out-Host
          if ($LASTEXITCODE -gt 1) { throw "7-Zip extraction failed with exit $LASTEXITCODE" }
          $candidates = Get-ChildItem -Path $root -Filter '*.exe' -Recurse -ErrorAction Stop |
            Where-Object { $_.Name -ieq 'TikTok LIVE Studio.exe' } |
            Sort-Object Length -Descending
          $exe = ($candidates | Select-Object -First 1).FullName
          if (-not $exe) { throw 'TikTok LIVE Studio.exe was not found inside the verified package.' }
          "LIVE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Extracted LIVE Studio executable: $exe"

      - name: Launch extracted LIVE Studio on native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:LIVE_EXE
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -ArgumentList '--remote-debugging-port=9223 --remote-debugging-address=127.0.0.1' -PassThru
          Write-Host "Started PID $($proc.Id)"
          $deadline = (Get-Date).AddMinutes(2)
          $best = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $all = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'TikTok|LIVEStudio|LiveStudio' }
            foreach ($row in $all) {
              try { $row.Refresh() } catch {}
              Write-Host ("PID={0} Name={1} Window={2} Title={3}" -f $row.Id,$row.ProcessName,$row.MainWindowHandle,$row.MainWindowTitle)
              if ($row.MainWindowHandle -ne 0) { $best = $row; break }
            }
            try {
              $cdp = Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 2 -ErrorAction Stop
              if ($cdp) { Write-Host "CDP_READY=true TARGETS=$($cdp.Count)" }
            } catch {}
            if ($best) { break }
            if ($proc.HasExited -and -not $all) { break }
          }
          if (-not $best) {
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'TikTok|LIVEStudio|LiveStudio' } | Format-List Id,ProcessName,MainWindowHandle,MainWindowTitle,Path
            throw 'TikTok LIVE Studio did not create a usable Windows window on the native Windows runner.'
          }
          Write-Host "WINDOW_READY=true PID=$($best.Id) TITLE=$($best.MainWindowTitle)"
