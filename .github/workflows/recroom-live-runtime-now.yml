name: Rec Room Live Runtime Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recroom-live-runtime-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Watch live Wine runtime until exact May 2022 client is ready
        shell: bash
        run: |
          set -euo pipefail
          base='https://echoxr-ripoteam-cloud-pc.hf.space/api/recroom-wine/capabilities'
          for attempt in $(seq 1 24); do
            url="$base?ts=$(date +%s)"
            curl -fsS --max-time 60 -H 'Cache-Control: no-cache' "$url" -o /tmp/cap.json
            python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cap.json'))
          checks=p.get('checks') or {}
          print(json.dumps({
            'provider': p.get('provider'),
            'readyForGame': p.get('readyForGame'),
            'exactBuild': p.get('exactBuild'),
            'client': checks.get('client'),
            'fingerprint': checks.get('fingerprint'),
            'manifest': checks.get('manifest'),
            'reason': p.get('reason'),
          }, separators=(',', ':')))
          PY
            if python3 - <<'PY'
          import json,sys
          p=json.load(open('/tmp/cap.json'))
          sys.exit(0 if p.get('readyForGame') is True and p.get('exactBuild') is True else 1)
          PY
            then
              echo 'RECROOM_EXACT_MAY_2022_READY=true'
              python3 -m json.tool /tmp/cap.json
              exit 0
            fi
            sleep 15
          done
          echo 'RECROOM_EXACT_MAY_2022_READY=false'
          python3 -m json.tool /tmp/cap.json
          exit 1
