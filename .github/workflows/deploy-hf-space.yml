name: Deploy RipoTeamServer to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/deploy-hf-space.yml"

permissions:
  contents: read

env:
  HF_SPACE_ID: Echoxr/ripoteamnewserver
  HF_SPACE_URL: https://echoxr-ripoteamnewserver.hf.space

concurrency:
  group: huggingface-space-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout server source
        uses: actions/checkout@v4

      - name: Check Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::Missing repository secret HF_TOKEN. Create a fine-grained Hugging Face write token for Echoxr/ripoteamserver-cloud-pc and save it as HF_TOKEN in GitHub repository secrets."
            exit 1
          fi

      - name: Configure new Space secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FIVEM_LICENSE_KEY: ${{ secrets.FIVEM_LICENSE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FIVEM_LICENSE_KEY:-}" ]; then
            echo "::error::Missing GitHub secret FIVEM_LICENSE_KEY. Add the Cfx.re key to GitHub Actions secrets before starting the Space."
            exit 1
          fi
          python -m pip install -q 'huggingface_hub>=0.30'
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.add_space_secret(
              repo_id=os.environ["HF_SPACE_ID"],
              key="FIVEM_LICENSE_KEY",
              value=os.environ["FIVEM_LICENSE_KEY"],
          )
          print("Configured the new Space's FIVEM_LICENSE_KEY secret.")

      - name: Sync Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          subdirectory: hf-space

      - name: Verify live Space health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 20 "${HF_SPACE_URL}/api/health" -o /tmp/space-health.json \
              && python - <<'PY'
          import json
          data = json.load(open('/tmp/space-health.json'))
          assert data.get('ok') is True
          print('Space health:', data.get('name', 'ok'))
          PY
            then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Hugging Face Space did not become healthy after deployment."
          exit 1

      - name: Start and verify Flux RP FXServer
        run: |
          set -euo pipefail
          SPACE_URL="${HF_SPACE_URL}"
          curl --fail --silent --show-error --max-time 30 -X POST "$SPACE_URL/api/flux/start" | tee /tmp/flux-start.json
          python - <<'PY'
          import json
          print('start=', json.load(open('/tmp/flux-start.json')))
          PY
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --max-time 30 "$SPACE_URL/api/flux/status" -o /tmp/flux-status.json
            if python - <<'PY'
          import json, sys
          data = json.load(open('/tmp/flux-status.json'))
          print(json.dumps({
              'status': data.get('status'),
              'server_name': data.get('server_name'),
              'mariadb_active': data.get('mariadb_active'),
              'tunnel_address': data.get('tunnel_address'),
              'direct_f8_command': data.get('direct_f8_command'),
              'game_build': data.get('game_build'),
          }))
          if data.get('status') == 'online' and data.get('mariadb_active') is True:
              sys.exit(0)
          sys.exit(1)
          PY
            then
              cp /tmp/flux-status.json /tmp/flux-status-final.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::Flux RP FXServer did not become online with MariaDB active." >&2
          cat /tmp/flux-status.json
          exit 1
