name: Probe TikTok LIVE stack once

# Final settled status #11
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-live-stack-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read settled LIVE Studio state
        env:
          SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
        run: |
          set -euo pipefail
          sleep 20
          curl --fail --silent --show-error --max-time 30 "$SPACE_URL/api/tiktok/live-studio-linux/status" -o /tmp/wine.json
          curl --fail --silent --show-error --max-time 30 "$SPACE_URL/api/tiktok/live-studio-linux/ui-capabilities" -o /tmp/ui.json
          echo '===== WINE ====='; python -m json.tool /tmp/wine.json
          echo '===== UI ====='; python -m json.tool /tmp/ui.json
