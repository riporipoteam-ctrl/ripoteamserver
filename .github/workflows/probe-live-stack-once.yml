name: Probe TikTok LIVE stack once

# PDH-shim diagnostic snapshot #8
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-live-stack-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Snapshot PDH shim and LIVE Studio status
        env:
          SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$SPACE_URL/api/tiktok/live-studio-linux/status" -o /tmp/wine.json
          python -m json.tool /tmp/wine.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/wine.json'))
          print('phase=', x.get('phase'))
          print('pdh_shim=', json.dumps(x.get('pdh_shim', {}), indent=2))
          PY
