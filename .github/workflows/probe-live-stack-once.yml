name: Probe TikTok LIVE stack once

# Immediate snapshot #2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-live-stack-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Snapshot LIVE Studio UI bridge and virtual mic
        env:
          SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/tiktok/live-studio-linux/status" -o /tmp/wine.json
          curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/tiktok/live-studio-linux/ui-capabilities" -o /tmp/ui.json
          curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/tiktok/server-audio/status" -o /tmp/audio.json
          echo '===== LIVE STUDIO ====='; python -m json.tool /tmp/wine.json
          echo '===== UI BRIDGE ====='; python -m json.tool /tmp/ui.json
          echo '===== SERVER AUDIO ====='; python -m json.tool /tmp/audio.json
