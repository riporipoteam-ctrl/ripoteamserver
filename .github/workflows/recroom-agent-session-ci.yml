name: Rec Room Agent Session CI

on:
  push:
    branches: [main]
    paths:
      - "windows-live-agent/**"
      - ".github/workflows/recroom-agent-session-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-session:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile fake Windows client with Rec Room endpoints and exact manifest evidence
        shell: pwsh
        run: |
          $gameDir = Join-Path $env:RUNNER_TEMP "May 19 2022 Agent Fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $gameDir "Recroom_Release_Data\il2cpp_data\Metadata") | Out-Null
          $source = Join-Path $env:RUNNER_TEMP "AgentFixture.cs"
          @'
          using System;
          using System.Drawing;
          using System.Windows.Forms;
          public class AgentFixture : Form {
            public AgentFixture() {
              Text = "Rec Room Agent CI Fixture"; ClientSize = new Size(900, 600); StartPosition = FormStartPosition.Manual; Location = new Point(30,30);
              var label = new Label { Dock = DockStyle.Fill, TextAlign = ContentAlignment.MiddleCenter, Text = "REC ROOM AGENT SESSION", Font = new Font("Arial", 28, FontStyle.Bold) };
              Controls.Add(label); var timer = new Timer { Interval = 500 }; int n=0; timer.Tick += (s,e) => { n++; label.Text = "SESSION FRAME " + n; }; timer.Start();
            }
            [STAThread] public static void Main() { Application.EnableVisualStyles(); Application.Run(new AgentFixture()); }
          }
          '@ | Set-Content $source -Encoding UTF8
          $exe = Join-Path $gameDir "Recroom_Release.exe"
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:$exe $source
          if ($LASTEXITCODE -ne 0) { throw "fixture compile failed" }
          $overlay = [Text.Encoding]::ASCII.GetBytes("https://accounts.rec.net/Accounts/account/me`0https://api.rec.net/api/config/v2`0https://rooms.rec.net/rooms/1")
          $s=[IO.File]::Open($exe,[IO.FileMode]::Append,[IO.FileAccess]::Write); try{$s.Write($overlay,0,$overlay.Length)}finally{$s.Dispose()}
          [IO.File]::WriteAllBytes((Join-Path $gameDir "GameAssembly.dll"), [Text.Encoding]::Unicode.GetBytes("https://match.rec.net/Matchmaking/player/login"))
          [IO.File]::WriteAllBytes((Join-Path $gameDir "Recroom_Release_Data\il2cpp_data\Metadata\global-metadata.dat"), [Text.Encoding]::ASCII.GetBytes("metadata"))

          # Mimic the exact local evidence DepotDownloader writes for a requested
          # old manifest. The identifier validates the sidecar SHA-1 before the
          # fixture may be treated as the May 19 2022 target.
          $configDir = Join-Path $gameDir ".DepotDownloader"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $manifest = Join-Path $configDir "471711_6337851004861751095.manifest"
          [IO.File]::WriteAllBytes($manifest, [Text.Encoding]::ASCII.GetBytes("CI ONLY - depot 471711 manifest 6337851004861751095 fixture"))
          $hex = (Get-FileHash -LiteralPath $manifest -Algorithm SHA1).Hash
          [byte[]]$shaBytes = for($i=0; $i -lt $hex.Length; $i+=2){ [Convert]::ToByte($hex.Substring($i,2),16) }
          [IO.File]::WriteAllBytes("$manifest.sha", $shaBytes)
          "AGENT_GAME_DIR=$gameDir" | Out-File $env:GITHUB_ENV -Append
      - name: Prove path names alone are rejected and manifest evidence is accepted
        shell: pwsh
        run: |
          $identifier = ".\windows-live-agent\identify-recroom-client.ps1"
          $good = (& $identifier -Root $env:AGENT_GAME_DIR -AsJson | Select-Object -Last 1) | ConvertFrom-Json
          if (-not $good.preferred.playableBy2022Agent) { throw "Strict identifier rejected valid manifest-cache fixture." }
          if ($good.preferred.confidence -ne "verified-steam-manifest-cache") { throw "Unexpected confidence: $($good.preferred.confidence)" }
          $sha = Join-Path $env:AGENT_GAME_DIR ".DepotDownloader\471711_6337851004861751095.manifest.sha"
          $backup = "$sha.ci-backup"; Move-Item $sha $backup -Force
          try {
            $bad = (& $identifier -Root $env:AGENT_GAME_DIR -AsJson | Select-Object -Last 1) | ConvertFrom-Json
            if ($bad.preferred.playableBy2022Agent) { throw "Identifier trusted a May-2022-looking folder without validated manifest evidence." }
            if ($bad.preferred.kind -ne "unverified-2022") { throw "Expected unverified-2022 after removing manifest checksum evidence." }
          } finally { Move-Item $backup $sha -Force }
          Write-Host "RECROOM_STRICT_BUILD_IDENTITY_OK=true"
      - name: Install host package and configure mock session
        shell: pwsh
        run: |
          $env:FLUX_RECROOM_CLIENT_DIR=$env:AGENT_GAME_DIR; $env:RECROOM_HOST_KEY="ci-host-key"
          $installDir=Join-Path $env:RUNNER_TEMP "AgentHost"
          & .\windows-live-agent\install-recroom-host.ps1 -InstallDir $installDir
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $config=Join-Path $installDir "recroom-agent-config.json"; $cfg=Get-Content $config -Raw|ConvertFrom-Json
          $cfg.server="http://127.0.0.1:18082"; $cfg.hostKey="ci-host-key"; $cfg.hostId="ci-win-host"; $cfg.clientDir=$env:AGENT_GAME_DIR
          $cfg.streamUrl="https://example.invalid/flux-recroom-ci-stream"; $cfg.streamStartCommand=""; $cfg.streamStopCommand=""; $cfg.autoUpdate=$false
          $cfg|ConvertTo-Json -Depth 8|Set-Content $config -Encoding UTF8
          "AGENT_INSTALL_DIR=$installDir"|Out-File $env:GITHUB_ENV -Append; "AGENT_CONFIG=$config"|Out-File $env:GITHUB_ENV -Append
      - name: Run two consecutive broker-driven sessions through the real agent
        shell: pwsh
        run: |
          $ready1=Join-Path $env:RUNNER_TEMP "ready-1.json"; $ready2=Join-Path $env:RUNNER_TEMP "ready-2.json"; $failed=Join-Path $env:RUNNER_TEMP "agent-failed.json"
          $mock=Join-Path $env:RUNNER_TEMP "mock-recroom-broker.py"
          @'
          import json, os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          r1,r2,failed=os.environ['READY1'],os.environ['READY2'],os.environ['FAILED']
          state={'start1':False,'stop1':False,'idle1':False,'start2':False,'stop2':False}
          class H(BaseHTTPRequestHandler):
            def log_message(self,*a): pass
            def sendj(self,c,o):
              b=json.dumps(o).encode(); self.send_response(c); self.send_header('content-type','application/json'); self.send_header('content-length',str(len(b))); self.end_headers(); self.wfile.write(b)
            def body(self):
              n=int(self.headers.get('content-length','0') or 0); return json.loads(self.rfile.read(n) or b'{}')
            def job(self,sid): return {'type':'start-session','sessionId':sid,'gatewayUrl':'http://127.0.0.1:19090','recnetSessionToken':'token-'+sid,'account':{'accountId':'1001','username':'ci-player'}}
            def do_GET(self):
              if not self.path.endswith('/jobs'): return self.sendj(404,{'error':'not found'})
              if not state['start1']: state['start1']=True; return self.sendj(200,{'job':self.job('ci-session-1')})
              if os.path.exists(r1) and not state['stop1']: state['stop1']=True; return self.sendj(200,{'job':{'type':'stop-session','sessionId':'ci-session-1'}})
              if state['idle1'] and not state['start2']: state['start2']=True; return self.sendj(200,{'job':self.job('ci-session-2')})
              if os.path.exists(r2) and not state['stop2']: state['stop2']=True; return self.sendj(200,{'job':{'type':'stop-session','sessionId':'ci-session-2'}})
              return self.sendj(200,{'job':None})
            def do_POST(self):
              payload=self.body()
              if self.path=='/api/recroom/hosts/register': return self.sendj(200,{'ok':True,'hostId':payload.get('hostId')})
              if self.path.endswith('/heartbeat'):
                meta=payload.get('metadata') or {}
                if state['stop1'] and not state['start2'] and not meta.get('activeSessionId'): state['idle1']=True
                return self.sendj(200,{'ok':True})
              if self.path.endswith('/ready'):
                dest=r2 if 'ci-session-2' in self.path else r1; open(dest,'w',encoding='utf-8').write(json.dumps(payload,indent=2)); return self.sendj(200,{'ok':True})
              if self.path.endswith('/failed'):
                open(failed,'w',encoding='utf-8').write(json.dumps({'path':self.path,'payload':payload},indent=2)); return self.sendj(200,{'ok':True})
              return self.sendj(404,{'error':'not found'})
          ThreadingHTTPServer(('127.0.0.1',18082),H).serve_forever()
          '@|Set-Content $mock -Encoding UTF8
          $env:READY1=$ready1;$env:READY2=$ready2;$env:FAILED=$failed
          $broker=Start-Process python -ArgumentList @("`"$mock`"") -PassThru -WindowStyle Hidden
          Start-Sleep -Milliseconds 700
          $env:RECROOM_AGENT_DIR=$env:AGENT_INSTALL_DIR
          $agentScript=Join-Path $env:AGENT_INSTALL_DIR "recroom-agent.ps1"; $agentOut=Join-Path $env:RUNNER_TEMP "agent.out.log"; $agentErr=Join-Path $env:RUNNER_TEMP "agent.err.log"
          $arg="-NoProfile -ExecutionPolicy Bypass -File `"$agentScript`" -Config `"$env:AGENT_CONFIG`""
          $agent=Start-Process powershell.exe -ArgumentList $arg -PassThru -RedirectStandardOutput $agentOut -RedirectStandardError $agentErr
          $both=$false
          for($i=0;$i -lt 180;$i++){
            if(Test-Path $failed){break}; if((Test-Path $ready1) -and (Test-Path $ready2)){$both=$true;break}; if($agent.HasExited){break}; Start-Sleep -Milliseconds 500
          }
          Write-Host 'AGENT_STDOUT:';Get-Content $agentOut -Raw -ErrorAction SilentlyContinue; Write-Host 'AGENT_STDERR:';Get-Content $agentErr -Raw -ErrorAction SilentlyContinue
          if(Test-Path $failed){Get-Content $failed -Raw;throw 'Agent reported a session failure.'}; if(-not $both){throw 'Agent did not make both consecutive sessions ready.'}
          foreach($file in @($ready1,$ready2)){
            $p=Get-Content $file -Raw|ConvertFrom-Json
            if($p.streamUrl -ne 'https://example.invalid/flux-recroom-ci-stream'){throw 'stream URL mismatch'}
            if([int]$p.redirectOccurrences -lt 4){throw 'redirect verification missing'}
            if([int]$p.proxyPort -ne 81){throw 'proxy port mismatch'}
          }
          Start-Sleep -Seconds 4; $log=Get-Content $agentOut -Raw -ErrorAction SilentlyContinue
          if(([regex]::Matches($log,'session ci-session-[12] is ready')).Count -lt 2){throw 'Both session ready logs were not observed.'}
          if(([regex]::Matches($log,'session stopped')).Count -lt 2){throw 'Both stop-session jobs were not processed.'}
          Write-Host 'RECROOM_TWO_CONSECUTIVE_AGENT_SESSIONS_OK=true'
          Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue; Stop-Process -Id $broker.Id -Force -ErrorAction SilentlyContinue
