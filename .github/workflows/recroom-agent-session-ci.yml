name: Rec Room Agent Session CI

on:
  push:
    branches: [main]
    paths:
      - "windows-live-agent/**"
      - ".github/workflows/recroom-agent-session-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-session:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile fake Windows client with Rec Room endpoints
        shell: pwsh
        run: |
          $gameDir = Join-Path $env:RUNNER_TEMP "May 19 2022 Agent Fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $gameDir "Recroom_Release_Data\il2cpp_data\Metadata") | Out-Null
          $source = Join-Path $env:RUNNER_TEMP "AgentFixture.cs"
          @'
          using System;
          using System.Drawing;
          using System.Windows.Forms;
          public class AgentFixture : Form {
            public AgentFixture() {
              Text = "Rec Room Agent CI Fixture"; ClientSize = new Size(900, 600); StartPosition = FormStartPosition.Manual; Location = new Point(30,30);
              var label = new Label { Dock = DockStyle.Fill, TextAlign = ContentAlignment.MiddleCenter, Text = "REC ROOM AGENT SESSION", Font = new Font("Arial", 28, FontStyle.Bold) };
              Controls.Add(label);
              var timer = new Timer { Interval = 500 }; int n=0; timer.Tick += (s,e) => { n++; label.Text = "SESSION FRAME " + n; }; timer.Start();
            }
            [STAThread] public static void Main() { Application.EnableVisualStyles(); Application.Run(new AgentFixture()); }
          }
          '@ | Set-Content $source -Encoding UTF8
          $exe = Join-Path $gameDir "Recroom_Release.exe"
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:$exe $source
          if ($LASTEXITCODE -ne 0) { throw "fixture compile failed" }
          $overlay = [Text.Encoding]::ASCII.GetBytes("https://accounts.rec.net/Accounts/account/me`0https://api.rec.net/api/config/v2`0https://rooms.rec.net/rooms/1")
          $s=[IO.File]::Open($exe,[IO.FileMode]::Append,[IO.FileAccess]::Write); try{$s.Write($overlay,0,$overlay.Length)}finally{$s.Dispose()}
          [IO.File]::WriteAllBytes((Join-Path $gameDir "GameAssembly.dll"), [Text.Encoding]::Unicode.GetBytes("https://match.rec.net/Matchmaking/player/login"))
          [IO.File]::WriteAllBytes((Join-Path $gameDir "Recroom_Release_Data\il2cpp_data\Metadata\global-metadata.dat"), [Text.Encoding]::ASCII.GetBytes("metadata"))
          "AGENT_GAME_DIR=$gameDir" | Out-File $env:GITHUB_ENV -Append
      - name: Install host package and configure mock session
        shell: pwsh
        run: |
          $env:FLUX_RECROOM_CLIENT_DIR=$env:AGENT_GAME_DIR
          $env:RECROOM_HOST_KEY="ci-host-key"
          $installDir=Join-Path $env:RUNNER_TEMP "AgentHost"
          & .\windows-live-agent\install-recroom-host.ps1 -InstallDir $installDir
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $config=Join-Path $installDir "recroom-agent-config.json"
          $cfg=Get-Content $config -Raw|ConvertFrom-Json
          $cfg.server="http://127.0.0.1:18082"
          $cfg.hostKey="ci-host-key"
          $cfg.hostId="ci-win-host"
          $cfg.clientDir=$env:AGENT_GAME_DIR
          $cfg.streamUrl="https://example.invalid/flux-recroom-ci-stream"
          $cfg.streamStartCommand=""
          $cfg.streamStopCommand=""
          $cfg.autoUpdate=$false
          $cfg|ConvertTo-Json -Depth 8|Set-Content $config -Encoding UTF8
          "AGENT_INSTALL_DIR=$installDir"|Out-File $env:GITHUB_ENV -Append
          "AGENT_CONFIG=$config"|Out-File $env:GITHUB_ENV -Append
      - name: Start mock broker and run the real Windows agent session lifecycle
        shell: pwsh
        run: |
          $readyFile=Join-Path $env:RUNNER_TEMP "agent-ready.json"
          $failedFile=Join-Path $env:RUNNER_TEMP "agent-failed.json"
          $mock=Join-Path $env:RUNNER_TEMP "mock-recroom-broker.py"
          @'
          import json, os, threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          ready=os.environ['MOCK_READY']; failed=os.environ['MOCK_FAILED']
          state={'start':False,'stop':False}
          class H(BaseHTTPRequestHandler):
            def log_message(self,*args): pass
            def sendj(self,code,obj):
              b=json.dumps(obj).encode(); self.send_response(code); self.send_header('content-type','application/json'); self.send_header('content-length',str(len(b))); self.end_headers(); self.wfile.write(b)
            def body(self):
              n=int(self.headers.get('content-length','0') or 0); return json.loads(self.rfile.read(n) or b'{}')
            def do_GET(self):
              if self.path.endswith('/jobs'):
                if not state['start']:
                  state['start']=True
                  return self.sendj(200,{'job':{'type':'start-session','sessionId':'ci-session','gatewayUrl':'http://127.0.0.1:19090','recnetSessionToken':'ci-session-token','account':{'accountId':'1001','username':'ci-player'}}})
                if os.path.exists(ready) and not state['stop']:
                  state['stop']=True
                  return self.sendj(200,{'job':{'type':'stop-session','sessionId':'ci-session'}})
                return self.sendj(200,{'job':None})
              return self.sendj(404,{'error':'not found'})
            def do_POST(self):
              payload=self.body()
              if self.path=='/api/recroom/hosts/register': return self.sendj(200,{'ok':True,'hostId':payload.get('hostId')})
              if self.path.endswith('/heartbeat'): return self.sendj(200,{'ok':True})
              if self.path.endswith('/ready'):
                open(ready,'w',encoding='utf-8').write(json.dumps(payload,indent=2)); return self.sendj(200,{'ok':True})
              if self.path.endswith('/failed'):
                open(failed,'w',encoding='utf-8').write(json.dumps(payload,indent=2)); return self.sendj(200,{'ok':True})
              return self.sendj(404,{'error':'not found'})
          ThreadingHTTPServer(('127.0.0.1',18082),H).serve_forever()
          '@|Set-Content $mock -Encoding UTF8
          $env:MOCK_READY=$readyFile; $env:MOCK_FAILED=$failedFile
          $brokerOut=Join-Path $env:RUNNER_TEMP "mock-broker.out.log"; $brokerErr=Join-Path $env:RUNNER_TEMP "mock-broker.err.log"
          $broker=Start-Process python -ArgumentList @("`"$mock`"") -PassThru -WindowStyle Hidden -RedirectStandardOutput $brokerOut -RedirectStandardError $brokerErr
          Start-Sleep -Milliseconds 700
          $agentScript=Join-Path $env:AGENT_INSTALL_DIR "recroom-agent.ps1"
          $agentOut=Join-Path $env:RUNNER_TEMP "recroom-agent.out.log"; $agentErr=Join-Path $env:RUNNER_TEMP "recroom-agent.err.log"
          $arg="-NoProfile -ExecutionPolicy Bypass -File `"$agentScript`" -Config `"$env:AGENT_CONFIG`""
          $agent=Start-Process powershell.exe -ArgumentList $arg -PassThru -RedirectStandardOutput $agentOut -RedirectStandardError $agentErr
          $ready=$false
          for($i=0;$i -lt 120;$i++){
            if(Test-Path $failedFile){Write-Host 'FAILED_CALLBACK:';Get-Content $failedFile -Raw;break}
            if(Test-Path $readyFile){$ready=$true;break}
            if($agent.HasExited){break}
            Start-Sleep -Milliseconds 500
          }
          Write-Host 'AGENT_STDOUT:';Get-Content $agentOut -Raw -ErrorAction SilentlyContinue
          Write-Host 'AGENT_STDERR:';Get-Content $agentErr -Raw -ErrorAction SilentlyContinue
          if(Test-Path $failedFile){Get-Content $failedFile -Raw; throw 'Agent reported session failed.'}
          if(-not $ready){throw 'Agent never reported session ready.'}
          $payload=Get-Content $readyFile -Raw|ConvertFrom-Json
          if($payload.streamUrl -ne 'https://example.invalid/flux-recroom-ci-stream'){throw 'Ready callback stream URL mismatch.'}
          if([int]$payload.redirectOccurrences -lt 4){throw 'Agent did not verify client endpoint redirects.'}
          if([int]$payload.proxyPort -ne 81){throw 'Agent did not report proxy port 81.'}
          Start-Sleep -Seconds 3
          $agentLog=Get-Content $agentOut -Raw -ErrorAction SilentlyContinue
          if($agentLog -notmatch 'session ci-session is ready'){throw 'Agent did not log session ready.'}
          if($agentLog -notmatch 'session stopped'){throw 'Agent did not process the stop-session job.'}
          Write-Host 'RECROOM_AGENT_SESSION_LIFECYCLE_OK=true'
          Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $broker.Id -Force -ErrorAction SilentlyContinue
