name: Verify live noVNC WebSocket

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-novnc.yml"
  pull_request:
    branches: [main]
    paths:
      - ".verification/novnc-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Test binary WebSocket and VNC greeting
        run: |
          echo "Live noVNC diagnostic revision 4"
          python -m pip install --quiet websockets
          python - <<'PY'
          import asyncio
          import datetime
          from pathlib import Path
          import websockets

          URI = "wss://echoxr-ripoteam-cloud-pc.hf.space/websockify"
          result = []

          async def check():
              try:
                  async with websockets.connect(
                      URI,
                      subprotocols=["binary"],
                      open_timeout=20,
                      close_timeout=5,
                      max_size=None,
                  ) as ws:
                      greeting = await asyncio.wait_for(ws.recv(), timeout=15)
                      if isinstance(greeting, str):
                          greeting = greeting.encode()
                      if ws.subprotocol != "binary":
                          raise RuntimeError(f"Unexpected subprotocol: {ws.subprotocol!r}")
                      if not greeting.startswith(b"RFB"):
                          raise RuntimeError(f"Unexpected VNC greeting: {greeting[:32]!r}")
                      result.extend([
                          "status=success",
                          f"subprotocol={ws.subprotocol}",
                          f"greeting={greeting[:12].decode(errors='replace').strip()}",
                          f"checked_at={datetime.datetime.now(datetime.timezone.utc).isoformat()}",
                      ])
              except Exception as exc:
                  result.extend([
                      "status=failure",
                      f"error_type={type(exc).__name__}",
                      f"error={exc!r}",
                      f"checked_at={datetime.datetime.now(datetime.timezone.utc).isoformat()}",
                  ])
                  raise

          try:
              asyncio.run(check())
          finally:
              Path("/tmp/novnc-status.txt").write_text("\n".join(result) + "\n")
              print("\n".join(result))
          PY

      - name: Save push verification result
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p .deployment-status
          cp /tmp/novnc-status.txt .deployment-status/novnc.txt
          git add .deployment-status/novnc.txt
          git commit -m "Record live noVNC WebSocket status" || true
          git push
