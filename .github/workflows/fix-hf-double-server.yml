name: Fix Hugging Face duplicate server start

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-hf-double-server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate Uvicorn launch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hf-space/app.py")
          text = path.read_text(encoding="utf-8")
          block = '''\n\nif __name__ == "__main__":\n    import uvicorn\n\n    uvicorn.run(app, host="0.0.0.0", port=7860, log_level="info")\n'''
          if block in text:
              path.write_text(text.replace(block, "\n"), encoding="utf-8")
              print("Removed duplicate Uvicorn launch.")
          else:
              print("Duplicate Uvicorn block was already absent.")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/app.py
          git commit -m "Fix Hugging Face duplicate port binding" || true
          git push
