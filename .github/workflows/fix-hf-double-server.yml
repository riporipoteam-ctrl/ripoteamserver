name: Repair Gradio Server backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-hf-double-server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair imports and duplicate ZeroGPU probe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hf-space/app.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace("from fastapp.", "from fastapi.")

          standalone = '''\n\n@spaces.GPU(duration=1)\ndef zero_gpu_runtime_probe() -> str:\n    \"\"\"Minimal GPU-decorated function required by ZeroGPU hosting.\"\"\"\n    return \"ZeroGPU runtime available\"\n'''
          text = text.replace(standalone, "", 1)

          if text.count("def zero_gpu_runtime_probe") != 1:
              raise SystemExit(
                  f"Expected exactly one ZeroGPU probe, found {text.count('def zero_gpu_runtime_probe')}"
              )
          if "from fastapp" in text:
              raise SystemExit("Broken fastapp import remains")
          if "from fastapi.middleware.cors import CORSMiddleware" not in text:
              raise SystemExit("FastAPI middleware import missing")
          if '@app.api(name="zero_gpu_runtime_probe")' not in text:
              raise SystemExit("Server API ZeroGPU endpoint missing")

          path.write_text(text, encoding="utf-8")
          print("Repaired Server mode source.")
          PY

      - name: Validate repaired source
        run: |
          python -m py_compile hf-space/app.py
          test "$(grep -c '^def zero_gpu_runtime_probe' hf-space/app.py)" -eq 1
          ! grep -F 'fastapp' hf-space/app.py
          grep -F 'from fastapi.middleware.cors import CORSMiddleware' hf-space/app.py
          grep -F '@app.api(name="zero_gpu_runtime_probe")' hf-space/app.py
          grep -F 'app.launch(show_error=True)' hf-space/app.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/app.py
          git commit -m "Repair Gradio Server backend" || true
          git push
