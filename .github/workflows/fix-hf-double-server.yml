name: Start Linux desktop in Gradio Server mode

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-hf-double-server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move desktop startup before app launch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hf-space/app.py")
          text = path.read_text(encoding="utf-8")

          startup_hook = '''\n\n@app.on_event("startup")\nasync def startup() -> None:\n    if os.environ.get("RIPO_SKIP_DESKTOP") != "1":\n        start_desktop()\n'''
          text = text.replace(startup_hook, "", 1)

          old_launch = "\n\napp.launch(show_error=True)\n"
          new_launch = '''\n\nif os.environ.get("RIPO_SKIP_DESKTOP") != "1":\n    start_desktop()\n\napp.launch(show_error=True)\n'''
          if old_launch not in text:
              raise SystemExit("Could not locate Gradio Server launch")
          text = text.replace(old_launch, new_launch, 1)

          path.write_text(text, encoding="utf-8")
          print("Desktop now starts before Gradio Server launch.")
          PY

      - name: Validate source
        run: |
          python -m py_compile hf-space/app.py
          grep -F 'start_desktop()' hf-space/app.py
          grep -F 'app.launch(show_error=True)' hf-space/app.py
          ! grep -F '@app.on_event("startup")' hf-space/app.py

      - name: Commit desktop startup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/app.py
          git commit -m "Start Linux desktop before Server launch" || true
          git push
