name: Configure Hugging Face ZeroGPU server

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-hf-double-server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable Gradio SSR and restore Uvicorn launch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hf-space/app.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'app = gr.mount_gradio_app(api, demo, path="/control")',
              'app = gr.mount_gradio_app(api, demo, path="/control", ssr_mode=False)',
          )

          launch = '''\n\nif __name__ == "__main__":\n    import uvicorn\n\n    uvicorn.run(app, host="0.0.0.0", port=7860, log_level="info")\n'''
          if 'if __name__ == "__main__":' not in text:
              text = text.rstrip() + launch

          path.write_text(text, encoding="utf-8")
          print("Configured ssr_mode=False and restored Uvicorn launch.")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/app.py
          git commit -m "Configure Gradio SSR for ZeroGPU" || true
          git push
