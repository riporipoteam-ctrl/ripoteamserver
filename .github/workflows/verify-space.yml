name: Verify Hugging Face Space

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Create or update Hugging Face Space"]
    types: [completed]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Space health endpoint
        id: health
        continue-on-error: true
        env:
          SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
        run: |
          set -u
          : > /tmp/last-health.txt
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/health" -o /tmp/last-health.txt; then
              python -m json.tool /tmp/last-health.txt
              exit 0
            fi
            echo "Space is still building or waking (attempt $attempt/60)."
            sleep 10
          done
          echo "Space did not become healthy in time." >&2
          exit 1

      - name: Verify TikTok server routes
        id: tiktok_server
        if: steps.health.outcome == 'success'
        continue-on-error: true
        env:
          SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/tiktok/server-connect/status" -o /tmp/server-connect.json
          curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/tiktok/server-live/status" -o /tmp/server-live.json
          curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/tiktok/live-studio-linux/status" -o /tmp/wine-live-studio.json
          python -m json.tool /tmp/server-connect.json
          python -m json.tool /tmp/server-live.json
          python -m json.tool /tmp/wine-live-studio.json
          python - <<'PY'
          import json
          connect=json.load(open('/tmp/server-connect.json'))
          live=json.load(open('/tmp/server-live.json'))
          wine=json.load(open('/tmp/wine-live-studio.json'))
          assert connect.get('ok') is True, connect
          assert connect.get('firefox_installed') is True, connect
          assert live.get('ok') is True, live
          assert 'phase' in live, live
          assert wine.get('ok') is True, wine
          assert wine.get('wine_installed') is True, wine
          assert str(wine.get('wine_version') or '').strip(), wine
          print('TikTok server routes and 64-bit Wine runtime verified.')
          PY

      - name: Wait for LIVE Studio Wine auto-probe
        id: wine_probe
        if: steps.tiktok_server.outcome == 'success'
        continue-on-error: true
        env:
          SPACE_URL: https://echoxr-ripoteam-cloud-pc.hf.space
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            curl --fail --silent --show-error --max-time 20 "$SPACE_URL/api/tiktok/live-studio-linux/status" -o /tmp/wine-live-studio-final.json
            PHASE=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/wine-live-studio-final.json')).get('phase',''))
          PY
            )
            echo "Wine LIVE Studio phase: $PHASE (attempt $attempt/45)"
            case "$PHASE" in
              running-wine|wine-failed) break ;;
            esac
            sleep 5
          done
          python -m json.tool /tmp/wine-live-studio-final.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/wine-live-studio-final.json'))
          phase=data.get('phase')
          assert phase in ('running-wine','wine-failed'), data
          print('Final Wine LIVE Studio probe:', phase)
          PY

      - name: Record health result
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          TIKTOK_SERVER_OUTCOME: ${{ steps.tiktok_server.outcome }}
          WINE_PROBE_OUTCOME: ${{ steps.wine_probe.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p .deployment-status
          {
            echo "Hugging Face Space health: ${HEALTH_OUTCOME}"
            echo "TikTok server routes: ${TIKTOK_SERVER_OUTCOME}"
            echo "Wine LIVE Studio probe: ${WINE_PROBE_OUTCOME}"
            echo "Space URL: https://echoxr-ripoteam-cloud-pc.hf.space"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for file in /tmp/last-health.txt /tmp/server-connect.json /tmp/server-live.json /tmp/wine-live-studio.json /tmp/wine-live-studio-final.json; do
              if [ -s "$file" ]; then
                echo
                echo "===== $(basename "$file") ====="
                cat "$file"
              fi
            done
          } > .deployment-status/space-health.txt
          git add .deployment-status/space-health.txt
          git commit -m "Record Hugging Face Space health ${HEALTH_OUTCOME}" || true
          git push

      - name: Fail if Space is unhealthy
        if: steps.health.outcome != 'success' || steps.tiktok_server.outcome != 'success'
        run: exit 1
