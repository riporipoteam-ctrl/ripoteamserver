name: Integrate sealed Telegram secret

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".verification/sealed-telegram.txt"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wire sealed secret loader into AI stack
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hf-space/ai_stack.py')
          text = path.read_text(encoding='utf-8')

          import_marker = 'from typing import Any\n'
          if 'from sealed_secrets import SealedSecretManager' not in text:
              text = text.replace(
                  import_marker,
                  import_marker + '\nfrom sealed_secrets import SealedSecretManager\n',
                  1,
              )

          init_marker = '        self.log_dir = log_dir\n'
          init_block = '''        self.log_dir = log_dir
        self.sealed_secrets = SealedSecretManager(
            admin_token=os.environ.get("ADMIN_TOKEN", ""),
            vnc_password=os.environ.get("VNC_PASSWORD", ""),
            base_dir=Path(__file__).resolve().parent,
        )
        self.sealed_secret_status = self.sealed_secrets.load_telegram_token()
'''
          if 'self.sealed_secrets = SealedSecretManager(' not in text:
              text = text.replace(init_marker, init_block, 1)

          old_telegram = '            "telegram": {"token_configured": bool(os.environ.get("TELEGRAM_BOT_TOKEN")), "allowlist_configured": bool(os.environ.get("TELEGRAM_ALLOWED_USERS")), "access_mode": "allowlist" if os.environ.get("TELEGRAM_ALLOWED_USERS") else "default-deny-pairing"},\n'
          new_telegram = '''            "telegram": {
                "token_configured": bool(os.environ.get("TELEGRAM_BOT_TOKEN")),
                "allowlist_configured": bool(os.environ.get("TELEGRAM_ALLOWED_USERS")),
                "access_mode": "allowlist" if os.environ.get("TELEGRAM_ALLOWED_USERS") else "default-deny-pairing",
                "sealing": self.sealed_secrets.status(),
            },
'''
          if old_telegram in text:
              text = text.replace(old_telegram, new_telegram, 1)
          elif '"sealing": self.sealed_secrets.status()' not in text:
              raise SystemExit('Telegram status marker not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m py_compile hf-space/sealed_secrets.py hf-space/ai_stack.py hf-space/app.py
          grep -F 'SealedSecretManager' hf-space/ai_stack.py
          grep -F '"sealing": self.sealed_secrets.status()' hf-space/ai_stack.py
          grep -F 'cryptography' hf-space/requirements.txt

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/ai_stack.py
          if git diff --cached --quiet; then
            echo "Sealed Telegram integration already present."
            exit 0
          fi
          git commit -m "Integrate sealed Telegram secret loader"
          git pull --rebase origin main
          git push origin HEAD:main
