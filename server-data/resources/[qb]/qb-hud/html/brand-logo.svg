<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <defs>
    <linearGradient id="fluxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="5" y="10" width="290" height="60" rx="10" fill="#0c101c" stroke="url(#fluxGrad)" stroke-width="2" />
  <!-- Text -->
  <text x="30" y="52" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="42" fill="#ffffff" filter="url(#glow)">FLUX</text>
  <text x="145" y="52" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="42" fill="#00e5ff" filter="url(#glow)">RP</text>
  <rect x="215" y="24" width="65" height="24" rx="4" fill="url(#fluxGrad)" />
  <text x="222" y="41" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#ffffff">RIPO</text>
</svg>
