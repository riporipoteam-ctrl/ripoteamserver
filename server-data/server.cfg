# ##################################################################
#                   FLUX RP — RIPO TEAM MASTER SERVER CONFIG
# ##################################################################

## Server Network & Endpoints
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

## Database Connection (MariaDB / MySQL via oxmysql)
set mysql_connection_string "mysql://root@127.0.0.1/fluxrp?charset=utf8mb4"
set mysql_slow_query_warning 300
set mysql_debug 0

## Voice Configuration (pma-voice)
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly false
setr voice_enableUi 1
setr voice_defaultCycle "F11"
setr voice_defaultVolume 0.3
setr voice_enableRadios 1
setr voice_enablePhones 1
setr voice_enableSubmix 1

## Game & Engine Settings
sv_enforceGameBuild 3095
sv_maxclients 48
sv_scriptHookAllowed 0
sv_lan 1
sv_master1 ""
set sv_enhancedHostSupport 1
set con_disableConsole 1

## Server Identity & Metadata
sv_hostname "Flux RP | Ripo Team GTA V Roleplay | Custom Economy & Jobs"
sets sv_projectName "Flux RP"
sets sv_projectDesc "Official Ripo Team GTA V FiveM Roleplay Server"
sets locale "en-US"
sets tags "roleplay, rp, custom, economy, jobs, police, ems, gangs, cars, custom-ui, ripoteam, flux, enhanced"
load_server_icon fluxrp_logo.png
set steam_webApiKey ""

## Server Registration Key (Protected Local Secret)
exec server_license.cfg

# ##################################################################
#                           PERMISSIONS & ROLES
# ##################################################################

# QBCore Resource Permissions
add_ace resource.qb-core command.add_ace allow
add_ace resource.qb-core command.add_principal allow
add_ace resource.qb-core command.remove_principal allow
add_ace resource.qb-core command.stop allow

# Default Staff Groups
add_ace group.admin command allow
add_ace qbcore.god command allow
add_ace qbcore.admin command allow
add_ace qbcore.mod command allow

add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod

# Server Owner: real_ripo6000
add_principal identifier.name:real_ripo6000 qbcore.god
add_principal identifier.fivem:real_ripo6000 qbcore.god
add_ace identifier.name:real_ripo6000 command allow
add_ace identifier.name:real_ripo6000 qbadmin allow
add_ace identifier.name:real_ripo6000 "qbadmin.*" allow
add_ace identifier.name:real_ripo6000 "command.*" allow

# Admin Trainer (vMenu / Menyoo Equivalent) Permissions
exec resources/[admin]/vMenu/config/permissions.cfg

